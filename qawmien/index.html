<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0B1A">
<title>Tactics testbed</title>
<!--
  A RULES TESTBED, not a game. The only question it exists to answer is
  whether the Dofus-shaped combat loop — action points, movement points,
  line of sight, range — is FUN on a phone. Everything here is deliberately
  disposable: the art is coloured shapes, because if the loop is only fun
  once it is pretty then it is not fun.

  Whatever survives here is DESIGN, and design ports to Unity. The code does
  not need to.
-->
<style>
  :root{
    --bg:#0E0B1A; --panel:#171331; --line:rgba(255,255,255,.10);
    --ink:#EDEAF6; --dim:#9C97B8;
    --you:#4FA9E8; --foe:#E8455F; --gold:#FFC542; --mp:#3DDC84;
    --ap:#8A5CFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;touch-action:manipulation}
  #wrap{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}

  /* ── top: whose turn, and the two pools that ARE the game ── */
  #top{flex:0 0 auto;padding:8px 10px 6px;display:flex;align-items:center;gap:8px}
  #who{font-weight:800;font-size:15px;flex:1 1 auto;min-width:0}
  /* the hint is the line that teaches the game, so it WRAPS rather than
     truncating — "…pick a spell to at" taught nobody anything */
  #who small{display:block;font-weight:600;font-size:11px;color:var(--dim);
    line-height:1.3;white-space:normal}
  .pool{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:10px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:800;font-size:14px}
  .pool b{font-size:16px;font-variant-numeric:tabular-nums}
  .pool.ap{color:#C9B4FF;border-color:rgba(138,92,255,.45)}
  .pool.mp{color:#8CF0BC;border-color:rgba(61,220,132,.45)}
  .pool i{font-style:normal;font-size:10px;opacity:.75;letter-spacing:.5px}

  /* ── the board ── */
  #boardwrap{flex:1 1 auto;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #float{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .dmg{position:absolute;font-weight:900;font-size:19px;text-shadow:0 2px 6px #000;
    animation:rise 1s ease-out forwards;will-change:transform,opacity}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
    18%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}
    100%{opacity:0;transform:translate(-50%,-42px) scale(1)}}
  #toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(10,8,20,.92);border:1px solid var(--line);border-radius:10px;
    padding:7px 13px;font-size:13px;font-weight:700;opacity:0;transition:opacity .18s;
    pointer-events:none;max-width:88%;text-align:center}
  #toast.on{opacity:1}

  /* ── spells ── */
  #spells{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 8px 0}
  .sp{position:relative;min-height:60px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.045);color:var(--ink);cursor:pointer;padding:6px 4px 5px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    transition:transform .12s ease-out,border-color .12s,background .12s}
  .sp:active{transform:scale(.96)}
  .sp .nm{font-weight:800;font-size:12px;line-height:1.1;text-align:center}
  .sp .co{font-size:10px;color:#C9B4FF;font-weight:700}
  .sp .rg{font-size:9.5px;color:var(--dim)}
  .sp.on{border-color:var(--gold);background:rgba(255,197,66,.16);
    box-shadow:0 0 0 1px var(--gold),0 6px 16px -8px rgba(255,197,66,.8)}
  .sp[disabled]{opacity:.34;cursor:default}
  .sp.cool{opacity:.45}
  .sp .cd{position:absolute;top:3px;right:5px;font-size:10px;font-weight:800;color:var(--gold)}

  /* ── bottom bar ── */
  #bar{flex:0 0 auto;display:flex;gap:6px;padding:8px}
  .btn{flex:1 1 auto;min-height:46px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--ink);font-weight:800;font-size:14px;
    cursor:pointer;transition:transform .12s ease-out}
  .btn:active{transform:scale(.97)}
  .btn.go{background:linear-gradient(180deg,#FFD979,#FFC542);color:#1A1206;border:0;
    box-shadow:0 6px 18px -8px rgba(255,197,66,.85)}
  .btn.ghost{flex:0 0 auto;padding:0 14px}

  #over{position:absolute;inset:0;display:none;place-items:center;background:rgba(8,6,16,.82);
    backdrop-filter:blur(3px);z-index:5}
  #over.on{display:grid}
  #over .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:22px 20px;text-align:center;max-width:300px}
  #over h2{margin:0 0 6px;font-size:24px}
  #over p{margin:0 0 16px;color:var(--dim);font-size:13.5px;line-height:1.5}

  @media (prefers-reduced-motion:reduce){
    .dmg{animation-duration:.01ms}
    .sp,.btn{transition:none}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div id="who">Your turn<small>Move, then strike</small></div>
    <div class="pool ap"><i>AP</i><b id="apv">6</b></div>
    <div class="pool mp"><i>MP</i><b id="mpv">3</b></div>
  </div>

  <div id="boardwrap">
    <canvas id="cv"></canvas>
    <div id="float"></div>
    <div id="toast"></div>
    <div id="over"><div class="card">
      <h2 id="ovt">—</h2><p id="ovp">—</p>
      <button class="btn go" id="again" type="button">Again</button>
    </div></div>
  </div>

  <div id="spells"></div>
  <div id="bar">
    <button class="btn ghost" id="map" type="button" title="Painted map / tactical grid">Map</button>
    <button class="btn ghost" id="undo" type="button">Cancel</button>
    <button class="btn go" id="end" type="button">End turn</button>
  </div>
</div>
<script src="sprite.js"></script>
<script src="tactics.js"></script>
</body>
</html>
