<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0B1A">
<title>Tactics testbed</title>
<!--
  A RULES TESTBED, not a game. The only question it exists to answer is
  whether the Dofus-shaped combat loop — action points, movement points,
  line of sight, range — is FUN on a phone. Everything here is deliberately
  disposable: the art is coloured shapes, because if the loop is only fun
  once it is pretty then it is not fun.

  Whatever survives here is DESIGN, and design ports to Unity. The code does
  not need to.
-->
<style>
  :root{
    --bg:#0E0B1A; --panel:#171331; --line:rgba(255,255,255,.10);
    --ink:#EDEAF6; --dim:#9C97B8;
    --you:#4FA9E8; --foe:#E8455F; --gold:#FFC542; --mp:#3DDC84;
    --ap:#8A5CFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;touch-action:manipulation}
  /* the HUD (hud.js) owns the whole combat chrome — the grown two-row bar
     with the skill icons, the orbs, Map and End turn, plus the turn strip
     top-left. --hud-bar-h is maintained by hud.js, so the board is sized
     clear of the bar before the grow animation even starts (§7.1). */
  #wrap{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;
    padding-bottom:var(--hud-bar-h,134px)}
  /* SIDEWAYS, THE BOARD GETS THE WHOLE SCREEN. The 560px cap is a portrait
     measure — it keeps a tall phone's board from stretching absurdly wide.
     Held sideways that same cap would waste a third of an 844px screen and
     shrink the map for no reason, when width is the dimension we have to
     spare and height is the one we do not. */
  @media (orientation:landscape){
    #wrap{max-width:none}
  }

  /* ── the board ── */
  #boardwrap{flex:1 1 auto;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #float{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .dmg{position:absolute;font-weight:900;font-size:19px;text-shadow:0 2px 6px #000;
    animation:rise 1s ease-out forwards;will-change:transform,opacity}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
    18%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}
    100%{opacity:0;transform:translate(-50%,-42px) scale(1)}}
  #toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(10,8,20,.92);border:1px solid var(--line);border-radius:10px;
    padding:7px 13px;font-size:13px;font-weight:700;opacity:0;transition:opacity .18s;
    pointer-events:none;max-width:88%;text-align:center}
  #toast.on{opacity:1}

  /* .btn / .btn.go survive for the one game-owned button left: Again,
     inside #over. The spell grid and the old #bar live in hud.js now. */
  .btn{flex:1 1 auto;min-height:46px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--ink);font-weight:800;font-size:14px;
    cursor:pointer;transition:transform .12s ease-out}
  .btn:active{transform:scale(.97)}
  .btn.go{background:linear-gradient(180deg,#FFD979,#FFC542);color:#1A1206;border:0;
    box-shadow:0 6px 18px -8px rgba(255,197,66,.85)}

  #ready{position:absolute;inset:0;display:none;place-items:end center;
    background:linear-gradient(to top,rgba(8,6,16,.9),rgba(8,6,16,0) 46%);
    z-index:6;padding-bottom:18px}
  #ready.on{display:grid}
  #ready .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;text-align:center;max-width:300px}
  #ready h2{margin:0 0 4px;font-size:20px}
  #ready p{margin:0 0 12px;color:var(--dim);font-size:13px}
  #over{position:absolute;inset:0;display:none;place-items:center;background:rgba(8,6,16,.82);
    backdrop-filter:blur(3px);z-index:5}
  #over.on{display:grid}
  #over .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:22px 20px;text-align:center;max-width:300px}
  #over h2{margin:0 0 6px;font-size:24px}
  #over p{margin:0 0 16px;color:var(--dim);font-size:13.5px;line-height:1.5}

  /* the end-of-battle sheet: a two-column ledger, so the eye runs down the
     values rather than hunting them inside sentences */
  #over .res{display:flex;flex-direction:column;gap:6px;margin-top:4px;text-align:left}
  #over .res-r{display:flex;justify-content:space-between;gap:14px;font-size:13px;
    padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.05);
    border:1px solid var(--line)}
  #over .res-r span:first-child{color:var(--dim)}
  #over .res-r span:last-child{font-weight:800;font-variant-numeric:tabular-nums}
  #over .res-r b{color:var(--ink)}
  #ovbtns{display:flex;gap:8px;margin-top:14px}
  #ovbtns .btn{flex:1 1 auto}

  @media (prefers-reduced-motion:reduce){
    .dmg{animation-duration:.01ms}
    .btn{transition:none}
  }
</style>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<script src="landscape.js"></script>
<script>
/* THE GATE, before anything draws. Combat pauses under the card rather than
   hiding behind it: a fight left running is still stepping timers, and when
   the phone comes back the camera must re-measure for the new viewport
   instead of resuming at the old one. */
LANDSCAPE.start(function (blocked) {
  try { if (window.TACTICS && TACTICS.setPaused) TACTICS.setPaused(blocked); } catch (e) {}
  if (!blocked) window.dispatchEvent(new Event('resize'));
});
</script>
<div id="wrap">
  <div id="boardwrap">
    <canvas id="cv"></canvas>
    <div id="float"></div>
    <div id="toast"></div>
    <div id="ready"><div class="card">
      <h2>Ready?</h2><p id="readysub">—</p>
      <button class="btn go" id="readygo" type="button">Ready</button>
    </div></div>
    <div id="over"><div class="card">
      <h2 id="ovt">—</h2><p id="ovp">—</p>
      <div id="ovbtns"><button class="btn go" id="done" type="button">OK</button><button class="btn ghost" id="again" type="button">Again</button></div>
    </div></div>
  </div>
</div>
<script src="hud-types.js"></script>
<script src="hud.js"></script>
<script src="sprite.js"></script>
<!-- GEAR is needed HERE, not only in world.html. Combat runs as an iframe and
     fightSpoils() rolls the drop tables inside it; without this the roll is
     guarded away and enemies silently never drop anything — the same trap that
     once had end-of-battle XP granted into the wrong window. It is pure data
     with no DOM, so loading it twice costs nothing. -->
<script src="purse.js"></script><!-- the one door to KARTI coins -->
<script src="gear.js"></script>
<script src="tactics.js"></script>
</body>
</html>
