<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0B1A">
<title>Tactics testbed — world</title>
<!--
  THE EXPLORE LAYER. index.html stays the combat testbed; this page is the
  Incarnam-style beginner zone wrapped around it: free-walk exploration,
  the tutorial ruin, and a hidden iframe that drops into the real AP/MP
  combat when a fight marker is tapped, then comes back.

  Boot glue only — every real behaviour lives in its module:
    WORLD (world.js)  map render / A* free-walk / camera / seams
    QUEST (quest.js)  tutorial steps, dialogue, coach toasts, #qhud
    PANELS(panels.js) inventory + character sheet
-->
<link rel="stylesheet" href="panels.css">
<link rel="stylesheet" href="hud.css"><!-- hud.js chrome: bottom bar (Bag /
  AP·HP·MP orbs / Hero) + settings gear/menu. The SAME file the combat
  document loads, so the two bars are pixel-identical where they overlap
  (HUD_SPEC §0 — that shared geometry IS the mode continuity) -->
<link rel="stylesheet" href="select.css"><!-- the reincarnation picker reuses
  select.html's UI (SELECTUI overlay); loaded up front so the moment never
  paints unstyled --><style>
  :root{
    --bg:#0E0B1A; --panel:#171331; --line:rgba(255,255,255,.10);
    --ink:#EDEAF6; --dim:#9C97B8;
    --you:#4FA9E8; --foe:#E8455F; --gold:#FFC542; --mp:#3DDC84;
    --ap:#8A5CFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;touch-action:manipulation}
  /* the world canvas stops at the HUD bar (hud.js maintains --hud-bar-h);
     WORLD.draw() refits the whole-map camera from the canvas box every
     frame, so the framed 10×10 map re-centres itself — HUD_SPEC §2.5 */
  #wcv{position:fixed;top:0;left:0;width:100%;
    height:calc(100% - var(--hud-bar-h,64px));
    display:block;touch-action:none}
  /* THE BAR MAY NOT COVER THE MAP — and this is the second half of the
     full-screen fix, not a retreat from it.
     Sideways, the canvas used to be given the WHOLE height and the bar was
     left to float over the bottom. That was right while a map was a
     diamond: the projection left the bottom corners empty, so the bar sat
     on nothing. The map is a RECTANGLE now (grid.js) and it reaches
     everywhere, so a floating bar sits on real cells — the owner could see
     them and could not tap them.
     So the canvas stops above the bar in every orientation. The map is
     framed into what is left, which is also what zooms it back out; and the
     SURROUND still paints the map's own ground to the screen edges, so the
     screen stays full of world even where the walkable part has run out. */

  /* combat iframe — full screen, above panels(40), below #dlg(50) and the
     quest coach toast(9999) so coaching overlays the fight */
  #cbf{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:45;
    display:none;background:var(--bg)}
  #cbf.on{display:block}

  /* ── the summoning-circle loading screen (loader.js drives it) ──────
     Markup + styles ship inline so the dark screen, logo and wordmark
     paint before ANY script or sprite sheet has even been requested.
     Above everything (100 > #reinc 60 > #dlg 50); it must also block
     input while a map's assets are still arriving. */
  #lscr{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:0;text-align:center;
    background:radial-gradient(120% 90% at 50% 34%,rgba(138,92,255,.14),transparent 52%),
      radial-gradient(140% 70% at 50% 100%,rgba(255,197,66,.05),transparent 55%),
      var(--bg);
    padding:calc(16px + env(safe-area-inset-top,0px)) 16px
            calc(16px + env(safe-area-inset-bottom,0px));
    transition:opacity .55s ease-out}
  #lscr[hidden]{display:none}
  #lscr.done{opacity:0;pointer-events:none}
  #lscr.done::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 44%,rgba(255,235,180,.9),
      rgba(255,197,66,.4) 34%,rgba(255,197,66,0) 68%);
    animation:lflare .6s ease-out forwards}
  @keyframes lflare{from{opacity:1}to{opacity:0}}
  .lring{position:relative;width:min(62vw,264px);aspect-ratio:1;margin-bottom:22px}
  #lcv{position:absolute;inset:0;width:100%;height:100%}
  #llogo{position:absolute;left:50%;top:50%;width:66%;height:66%;
    transform:translate(-50%,-50%);object-fit:contain;
    filter:drop-shadow(0 6px 18px rgba(138,92,255,.35))}
  #lscr.noart #llogo{display:none}
  .lmark{margin:0;font-size:clamp(26px,7.4vw,38px);font-weight:900;
    letter-spacing:.16em;color:var(--gold);text-indent:.16em;
    text-shadow:0 0 24px rgba(255,197,66,.35)}
  .lsub2{margin:6px 0 0;font-size:11px;font-weight:800;letter-spacing:.52em;
    text-indent:.52em;color:#B9A8F5}
  #lsub{margin:18px 0 0;font-size:12px;font-weight:700;color:var(--dim);
    font-variant-numeric:tabular-nums;min-height:1.2em}
  #lerr{margin-top:14px;max-width:300px}
  #lerr p{margin:0 0 10px;font-size:13px;line-height:1.45;color:#F2B8C2}
  #lretry{min-height:44px;padding:0 22px;border:0;border-radius:12px;
    background:linear-gradient(180deg,#FFD979,#FFC542);color:#1A1206;
    font-weight:800;font-size:14px;cursor:pointer}
  #lretry:active{transform:scale(.97)}
  @media (prefers-reduced-motion:reduce){
    #lscr{transition:opacity .15s}
    #lscr.done::after{animation:none;content:none}
  }
</style>
</head>
<body>
<script src="landscape.js"></script>
<script>
/* Same gate for the world. WORLD re-measures its canvas on resize, so
   firing one when the phone comes back is all it needs. */
LANDSCAPE.start(function (blocked) {
  if (!blocked) window.dispatchEvent(new Event('resize'));
});
</script>

<script>
/* Apply a cloud character adopted by net.js on the PREVIOUS page life.
   It rides sessionStorage because writing localStorage before reloading
   loses a race: player.js autosaves the OLD hero on pagehide, which
   fires after adopt(). Running here — before player.js reads
   localStorage — nothing can clobber the adopted save. */
(function () { try {
  var a = sessionStorage.getItem('tactics.sync.adopt');
  if (!a) return;
  sessionStorage.removeItem('tactics.sync.adopt');
  a = JSON.parse(a);
  if (!a || typeof a !== 'object' || !a.hero) return;
  localStorage.setItem('tactics.hero.v1', JSON.stringify(a.hero));
  /* THE KEY QUEST ACTUALLY USES. This ran before quest.js loads, so it
     cannot ask — but writing a hard-coded version meant an adopted save
     landed in a key nothing reads. Kept in step with quest.js's LSK. */
  var QK = 'tactics.quest.tutorial.v2';
  if (a.quest) localStorage.setItem(QK, JSON.stringify(a.quest));
  else localStorage.removeItem(QK);
} catch (e) {} })();
</script>

  Loads LAST so HERO/QUEST exist; offline it is inert and the game is untouched -->

<script>
'use strict';
/* ── boot (WORLD_SPEC §8, amended) ────────────────────────────────────
   window.PLAYER is no longer built here: player.js (window.HERO) creates
   it, restores the saved identity + progress from localStorage
   ('tactics.hero.v1') and keeps class-derived stats correct. */
QUEST.start();
/* Resume where the hero last stood — player.js persists {map,c,r} inside
   'tactics.hero.v1' and serves it back through HERO.where(). Fall back to
   the start map for a fresh hero, an unknown map id, a tile that is no
   longer statically walkable, or one a map edit put an npc/fight on. */
/* ── CREATION COMES FIRST ─────────────────────────────────────────────
   The player is being SUMMONED. What they come back as should be settled
   before they have a body — so on a fresh hero the circle opens BEFORE the
   world is loaded, and they step onto the engraving already themselves.

   Previously they spawned as the default hero, walked to the Caretaker, and
   only then chose; the game showed a stranger's body and swapped it, which
   undercut the one moment the whole opening is built around.

   FIRST ENTRY ONLY. HERO.chosen() is false exactly once in a character's
   life, so every later entry falls straight through to boot() and resumes
   where they stood. quest.js already carries the greeting for an
   already-made character (LINES.elder0, "the circle still burns — and it
   remembers you"), so the Caretaker now welcomes what they are instead of
   asking what to be. */
function create(next){
  const fresh = window.HERO && window.SELECTUI && !HERO.chosen();
  if (!fresh) return next();
  try {
    window.SELECTUI.openOverlay({
      label: 'The summoning circle — choose what you came back as',
      title: 'The circle asks',
      subtitle: 'What did you come back as? Tap a shape — watch it move.',
      verb: 'Awaken as',
      onConfirm: p => { HERO.choose(p.classId, p.gender, p.look); next(); },
      /* THE CIRCLE CANNOT BE DECLINED on a fresh hero. There is no world
         behind this yet — dismissing it with the ✕ or Esc would leave the
         player looking at nothing, with no body and nowhere to be. So a
         cancel simply reopens it. It is not a trap: there is exactly one
         way forward and it is the thing they came here to do. */
      onCancel: () => setTimeout(() => create(next), 0)
    });
  } catch (e) { next(); }        /* never let the picker strand the boot */
}
create(function boot(){
  const at = (window.HERO && HERO.where) ? HERO.where() : null;
  if (at && window.MAPS && MAPS[at.map] &&
      WT.isWalkable(MAPS[at.map], at.c, at.r)){
    const mk = WT.markerAt(MAPS[at.map], at.c, at.r);
    if (!(mk && (mk.type === 'npc' || mk.type === 'fight')) &&
        WORLD.load(at.map, { c: at.c, r: at.r })) return;
  }
  WORLD.load(window.MAP_INDEX ? MAP_INDEX.start : 'ruin-01');
});

/* Seal the boot cycle: everything the FIRST screen needs is now known
   (registered by WORLD.load above), so the circle completes when the
   last of it lands — and only THEN does every way out of this map start
   warming, quietly, in the background. Prefetching can never delay the
   player getting control. Retry re-attempts every failed image. */
LOADER.onRetry(() => WORLD.retryAssets());
LOADER.seal(() => WORLD.schedulePrefetch());

/* HUD — hud.js owns the whole bottom bar + settings (HUD_SPEC §1/§2).
   Bag and Hero live at the bar's edges now; the orbs between them are
   display-only. Settings actions never reach here (hud.js handles them). */
HUD.init({ mode: 'explore', onAction: (action) => {
  if (action === 'bag')       PANELS.toggle('inventory');
  else if (action === 'hero') PANELS.toggle('stats');
}});

/* ── combat handoff: hidden iframe over the world ─────────────────── */
const cbf = document.getElementById('cbf');
let fightMk = null, pollT = 0;

function startFight(mk){
  if (fightMk) return;                 /* one fight at a time */
  fightMk = mk;
  WORLD.setMode('combat');
  cbf.onload = () => {                 /* iframe scripts have run → T exists */
    try { QUEST.attachCombat(cbf.contentWindow); } catch (e) {}
  };
  cbf.src = 'index.html';
  cbf.classList.add('on');
  pollT = setInterval(() => {
    /* WAIT FOR THE PLAYER, not for the outcome. Polling G.over tore the
       fight down within half a second of the last blow, taking the results
       screen — xp, drops, level-up — with it before anyone could read it.
       tactics.js sets G.closed when OK is pressed; that is the signal. */
    let over = 0, closed = false;
    try {
      const w = cbf.contentWindow;
      if (w && w.T && w.T.G) { over = w.T.G.over; closed = !!w.T.G.closed; }
    } catch (e) {}
    if (over !== 0 && closed) endFight(over);
  }, 500);
}

function endFight(over){
  clearInterval(pollT); pollT = 0;
  QUEST.detachCombat();                /* idempotent — QUEST also self-detaches */
  cbf.classList.remove('on');
  cbf.onload = null;
  cbf.src = '';
  WORLD.setMode('explore');
  const mk = fightMk; fightMk = null;
  if (over === 1 && mk){
    WORLD.removeMarker(mk.id);         /* a beaten fight stays down this session */
    /* EACH TUTORIAL FIGHT ADVANCES ITS OWN STEP. The dummy pays the body of
       the novice kit, the goblin pays the helm and the blade — advance() is
       what grants them, and it only fires on the step that is actually next,
       so a re-fought marker cannot mint a second set. */
    if (mk.id === 'bones'  && QUEST.state().step === 1) QUEST.advance(2);
    if (mk.id === 'goblin' && QUEST.state().step === 2) QUEST.advance(3);
  }
}

/* ── quest wiring — QUEST owns all elder dialogue and step logic ──── */
WORLD.onNpc(m => {
  if (QUEST.npc(m)) return;            /* handled (dialogue shown / fight blocked) */
  if (m.type === 'fight'){ startFight(m); return; }
  if (m.id === 'shep')                 /* flavour NPC out in the fields */
    QUEST.say(m.name, [
      'Baa— ah, no, that was me. The woollies scattered when the bones started walking.',
      'If you find any out here… try not to fight the friendly ones.'
    ]);
});

WORLD.onExit((from, to) => {
  /* THE LAST RUIN ROOM IS THE ONE WITH THE DOOR, and the island screen it
     opens onto is field-2-1. This said ruin-02 -> field-0-0, which stopped
     being true when the island was regenerated: the step never advanced and
     nothing said so. Keyed on leaving the ruin at all now, so a renamed
     field map cannot silently break the tutorial again. */
  if (/^ruin-/.test(from) && /^field-/.test(to) && QUEST.state().step === 3)
    QUEST.advance(4);
  /* leaving a map is a sync checkpoint (net.js can't take this slot —
     WORLD.onExit is single-callback and this page owns it) */
  if (window.NET) NET.checkpoint('map');
});

/* ── RAF loop — the page owns it, WORLD does the rest ─────────────── */
const g = document.getElementById('wcv').getContext('2d');
let last = 0;
function loop(now){
  const dt = last ? now - last : 16;
  last = now;
  WORLD.update(dt);                    /* internally clamped to 50 ms */
  WORLD.draw(g);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
