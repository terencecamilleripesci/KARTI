<!-- ══ WHAT A SHARED LINK LOOKS LIKE ═══════════════════════════════════
     Without these, pasting the link into WhatsApp shows a bare URL and
     nobody taps it. These are what build the preview card: the image, the
     name, the one line that has to do the selling.

     THE URLs MUST BE ABSOLUTE. WhatsApp, Messenger and iMessage fetch the
     page from their own servers with no notion of where it came from, so a
     relative path resolves against nothing and the preview comes back
     blank. That is the single most common way this is got wrong.

     The image is a JPEG on purpose: WhatsApp quietly drops previews over
     ~300KB, and the PNG of the same card is 590KB against the JPEG's 108. -->
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="KARTI">
<meta property="og:title"       content="KARTI — Malta's rudest card duel">
<meta property="og:description" content="200 cards, 26 games and a fleet to sink. Free, on your phone. 18+">
<meta property="og:url"         content="https://terencecamilleripesci.github.io/KARTI/">
<meta property="og:image"       content="https://terencecamilleripesci.github.io/KARTI/art/ui/share.jpg?v=246">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt"   content="KARTI — Malta's rudest card duel">
<meta property="og:locale"      content="en_MT">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="KARTI — Malta's rudest card duel">
<meta name="twitter:description" content="200 cards, 26 games and a fleet to sink. Free, on your phone. 18+">
<meta name="twitter:image"       content="https://terencecamilleripesci.github.io/KARTI/art/ui/share.jpg?v=246">
<link rel="manifest" href="manifest.json">
<!-- THE ICON, DECLARED THE WAY THINGS ACTUALLY ASK FOR IT.
     /favicon.ico is requested BY NAME, at the site root, by browsers and by
     iOS when it builds the link card in the share sheet. Ours 404'd, so the
     share sheet fell back to Safari's compass — the app looked unbranded at
     the exact moment somebody was sending it to a friend, which is the one
     moment it cannot afford to.
     apple-touch-icon is 180 because that is the size iOS asks for; it was
     pointed at the 192 PWA icon and resampled every time. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<!-- Deliberately NO apple-mobile-web-app-capable and NO
     apple-mobile-web-app-status-bar-style. Those are the LEGACY iOS full-screen
     mechanism from before manifests, and they make iOS lay the WebView out the
     old way: it reports a viewport a status-bar shorter than the screen (measured
     on his phone: 894 of 956) and leaves a dead strip along the bottom that no
     page CSS can reach. Every bottom-gap workaround this file has carried was
     chasing that. The mia-party app, which renders correctly on the same phone,
     sets neither and relies on manifest "display":"standalone" alone — modern iOS
     honours it and gives the page the whole screen with real safe-area insets.
     Do not add them back. -->
<meta name="mobile-web-app-capable" content="yes">
<!-- The home background is the first thing the player sees and it is only ever
     requested from JS (detectArt's probe). Preloading it starts the download in
     parallel with the scripts, so on a cold launch the art is usually decoded
     before the home screen even renders — and the copy lands in the HTTP cache
     as a second safety net beside the service-worker precache. -->
<link rel="preload" as="image" href="art/ui/home-bg.jpg" fetchpriority="high">
<!-- The three heaviest first-wave scripts (game.js and mp.js are ~280 KB each,
     progress.js ~140 KB). The loader that requests them sits at the END of this
     ~150 KB document, so without a hint their downloads start only after the
     whole page has parsed. Preloading from the head starts them immediately;
     the loader's own script tags then reuse the same in-flight fetches.
     Everything else in wave 1 is small enough not to need a hint. -->
<link rel="preload" as="script" href="js/game.js">
<link rel="preload" as="script" href="js/mp.js">
<link rel="preload" as="script" href="js/progress.js">
<!-- The splash backdrop is the actual first paint (the inline splash script
     swaps it in the moment it decodes) — start it alongside the scripts rather
     than when that script runs. Default (low) image priority on purpose: it
     must not outrank the boot js. -->
<link rel="preload" as="image" href="art/ui/loading-bg.webp">
<!-- The display face is SELF-HOSTED, and it is Exo 2 rather than Orbitron, for
     two reasons that are really one.
     1. A Google Fonts stylesheet is a third-party request, so an offline PWA
        lost its display face the moment the phone had no signal.
     2. Orbitron ships a "latin" subset ONLY — U+0000-00FF. Maltese lives in
        Latin Extended-A: ħ U+0127, ġ U+0121, ż U+017C, ċ U+010B. So every
        Maltese heading in this game — BAĦAR, RAŻŻETT, IL-ĦAŻEN — was being
        rendered half in Orbitron and half in the fallback face, MID-WORD.
        In a game written in Maltese that is not a small thing.
     Exo 2 keeps the same squared, technical character and carries latin-ext,
     so the language the game is written in renders in one typeface. Both
     weights come from one variable file per subset; 77 KB for the lot. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/exo2-700-latin.woff2" crossorigin>

<style>
/* ══════════════════ TOKENS ══════════════════ */
/* ══ KARTI THEME TOKENS — the ONE surface cosmetics repaint ═══════════════
   Every colour the entry gate, the Home screen and the tab bar paint reads
   from these custom properties on the ROOT element (documentElement). A
   cosmetic theme changes the app by rewriting THESE and nothing else —
   call window.KARTI_THEME.apply({...}) (defined in the shell script at the
   end of this file) with any subset of:

     accent      → --kx-accent        gold #FFC542. Primary action, active tab,
                                      highlights, the KAR half of the wordmark.
     accentInk   → --kx-accent-ink    #241800. Text/icon sitting ON --kx-accent.
     accent2     → --kx-accent-2      festa crimson #E63950. The hot action
                                      (PLAY NOW / STORY MODE), the TI half.
     accent2Deep → --kx-accent-2-deep #C8102E. Dark tail of the crimson
                                      gradient; pressed/shadow tone.
     bg          → --kx-bg            plum-black #120D0B. The app floor.
     bg2         → --kx-bg-2          #2A1B47. The warm upper tint the
                                      backdrop gradients breathe with.
     surface     → --kx-surface       glass panel/chip fill (translucent).
     ink         → --kx-ink           #F4EFFF primary text.
     dim         → --kx-dim           #A093C4 secondary text.
     tabBg       → --kx-tab-bg        tab-bar fill. NOT set directly any more:
                                      it is COMPUTED from tabTint + tabAlpha
                                      below so the bar's COLOUR and its
                                      MATERIAL are two independent choices.
                                      (The key still exists for compatibility;
                                      an inline --kx-tab-bg would win.)
     tabTint     → --kx-tab-tint      the bar's COLOUR (the tabcolour slot).
     tabAlpha    → --kx-tab-alpha     the bar's MATERIAL: how opaque the tint
                                      paints — glass 88%, solid 100%, veil 42%.
     tabInk      → --kx-tab-ink       inactive tab label/icon colour. No :root
                                      default on purpose: unset, the two .tab
                                      rules fall back to their stock mixes, so
                                      stock renders byte-identical.
     tabOn       → --kx-tab-on        active-tab colour (defaults to gold).
     glow        → --kx-glow          the atmosphere: ember/hearth radial glow
                                      (translucent warm orange).
     ember       → --kx-ember         the bright core of a rising ember mote.
     homeBg      → --kx-home-bg       IMAGE. Home backdrop override. Default
                                      `none` = the stock street/hero art keeps
                                      painting; a theme sets url(...) and it
                                      paints OVER the stock art (the scrim
                                      stays on top so text keeps contrast).
     gateBg      → --kx-gate-bg       IMAGE. Entry-gate backdrop. Defaults to
                                      the splash festa painting.
     appBg       → --kx-app-bg        IMAGE. The APP-WIDE backdrop: the menu
                                      screens (Store, Collection, Inventory,
                                      Friends, Story, lobbies — see the rule
                                      in css/extra.css) paint it behind their
                                      content, so an equipped scene follows
                                      the player through the whole app instead
                                      of stopping at Home. Default `none` =
                                      stock. applyKx() composes the scene's
                                      art with its own readability veil into
                                      this one value. GAME surfaces (#scr-duel,
                                      #scr-party, #scr-kiri) deliberately do
                                      NOT read it — a board must stay legible
                                      mid-game whatever picture is equipped.

   LIGHT THEMES: a theme whose field is light (Roża Ħelwa) also puts the class
   `kx-light` on <html> (applyKx in js/progress-ui.js). The html.kx-light
   blocks below and in css/extra.css re-aim the few surfaces that hard-code a
   "dark background" assumption (scrims, the wordmark treatment, the hard
   whites). With no theme equipped the class is absent and every stock rule
   applies untouched.

   Rules for future work: any NEW colour on these three screens must be
   derived from a --kx-* token (color-mix is fine); never hard-code. Legacy
   tokens below (--gold/--hot/…) are aliased to the kx set so the rest of
   the app follows the theme where it already used them.                    */
:root{
  --kx-accent:#FFC542; --kx-accent-ink:#241800;
  --kx-accent-2:#E63950; --kx-accent-2-deep:#C8102E;
  --kx-bg:#120D0B; --kx-bg-2:#2A1B47;
  --kx-surface:rgba(34,22,40,.66);
  --kx-ink:#F4EFFF; --kx-dim:#A093C4;
  /* The tab bar's fill, SPLIT: --kx-tab-tint is the COLOUR (the tabcolour
     slot), --kx-tab-alpha the MATERIAL (the tabstyle slot: glass 88%, solid
     100%, veil 42%). --kx-tab-bg is computed from the pair, so the two slots
     compose without knowing about each other. Stock computes to the exact
     rgba(16,10,20,.88) it always was. */
  --kx-tab-tint:#100A14; --kx-tab-alpha:88%;
  --kx-tab-bg:color-mix(in srgb,var(--kx-tab-tint) var(--kx-tab-alpha),transparent);
  --kx-tab-on:#FFC542;
  --kx-glow:rgba(255,170,60,.20); --kx-ember:#FFDE9B;
  --kx-home-bg:none;
  --kx-gate-bg:url("art/ui/loading-bg.webp");
  --kx-app-bg:none;
}
:root{
  --bg:#0E0B14; --panel:#1B1430; --panel2:#241A3E;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --txt:var(--kx-ink); --dim:var(--kx-dim); --dim2:#7F73A0;
  /* gold + hot are ALIASES of the theme accents now, so every button, pill and
     glow that already used them follows an equipped theme for free. */
  --gold:var(--kx-accent); --hot:var(--kx-accent-2);
  --neon:#8A5CFF; --ok:#3DDC84; --bad:#FF5468;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --disp:'Exo 2','Arial Black',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.22,.9,.28,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* THE MIA-PARTY SHELL. webclients/mia-party is the one app already proven to
   render correctly on his exact phone, installed from a manifest with
   display:standalone — so its shape is copied here wholesale rather than
   invented again: html/body/#app all height:100dvh and overflow:hidden, shell
   position:relative, safe-area insets carried as padding. 100dvh is the
   DYNAMIC viewport — the height that is genuinely visible right now. It
   tracks Safari's toolbars in a tab, and in the installed app it is simply
   the screen; the 100vh line before each dvh is only a fallback for engines
   without dvh support. */
html,body{height:100vh;height:100dvh;overflow:hidden}
/* CHROME'S PULL-TO-REFRESH. `overscroll-behavior` was set on <body> only.
   The viewport takes its value from the ROOT element, and the body→viewport
   propagation Chrome does only happens while the root's own value is `auto`
   — which it is here by accident, not by intent, and any future rule on
   <html> would silently switch pull-to-refresh back on. It is stated on the
   root as well so it cannot: a downward swipe on a board, a hand of cards or
   a tombla card is a game gesture, and letting it reload the app mid-game is
   an easy way to lose one. Nothing on iOS changes — Safari has no
   pull-to-refresh and already honoured this against rubber-banding. */
html{overscroll-behavior:none}
/* A base colour rather than a gradient, chosen to match the tab bar. Not a
   workaround: with status-bar-style "black" the viewport reaches the physical
   bottom and there is no strip to hide. It simply means any area the browser
   paints outside the document (rubber-banding, a UI transition) matches the
   chrome instead of flashing a different colour. */
body{
  margin:0;background-color:var(--kx-bg);
  background-image:
    radial-gradient(1100px 700px at 50% -12%, var(--kx-bg-2) 0%, transparent 62%),
    radial-gradient(700px 500px at 110% 100%, color-mix(in srgb,var(--kx-bg-2) 82%,#000) 0%, transparent 60%);
  color:var(--txt);font-family:var(--body);font-size:16px;line-height:1.45;
  /* overflow:hidden on html AND body, exactly like mia-party. The build-31
     theory that the document must stay scrollable is contradicted by that
     working app: it locks the document and still reaches the bottom edge. */
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9000;opacity:.16;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--disp);letter-spacing:.04em;margin:0;font-weight:900}
.mono{font-variant-numeric:tabular-nums}

/* ══════════════════ ICONS ══════════════════
   One inline SVG sprite sits at the top of <body> (source: icons/sprite.svg).
   Every glyph is drawn on a 24x24 grid in currentColor, so an icon simply takes
   the colour of the text around it and scales with font-size — no emoji font,
   no raster, nothing to download. `.ico` deliberately does NOT set fill/stroke:
   those live on the <symbol> as presentation attributes so the solid marks
   (rarities, sparks, blades) keep their fills. */
.ico{width:1em;height:1em;flex:0 0 auto;display:inline-block;vertical-align:-.14em}
/* icon + label inside a .btn: .btn is a column flexbox, so the pair has to be
   wrapped or the icon lands on its own line above the words */
.bl{display:inline-flex;align-items:center;justify-content:center;gap:.55em;line-height:1.15}
.pill .ico,.chip .ico,.badge .ico,.tag .ico{font-size:1.25em}
.btn .ico{font-size:1.3em}
.btn.sm .ico{font-size:1.35em}
.dhead .ico,.seg2 .ico,.segwrap .ico{font-size:1.25em}
.tag .ico{vertical-align:-.18em}

/* ══════════════════ SHELL ══════════════════ */
/* The mia-party shell (see the note on html,body above): position:RELATIVE,
   not fixed, so this is a normal in-flow box and nothing here depends on how
   iOS chooses to anchor fixed elements against a layout viewport it sometimes
   mis-sizes; height:100dvh, the dynamic viewport, which is the visible height
   in a tab and the whole screen in the installed app. No display-mode media
   queries, no JS-measured heights — the same declaration serves both. Build 31
   (position:fixed + height:100vh) sized the shell to the LARGE viewport, which
   in a stale black-translucent install is 62px taller than what is painted, so
   the tab bar's bottom was pushed off-screen. dvh cannot overshoot like that. */
#app{position:relative;height:100vh;height:100dvh;overflow:hidden}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) calc(var(--sab) + 8px) calc(var(--sal) + 12px);
}
.screen.on{display:flex;animation:scrIn .26s var(--ease) both}
/* Opacity only — deliberately NO transform. `animation-fill-mode: both` keeps the
   final keyframe applied forever, and even `transform:none` computes to an
   identity matrix, which makes the element a containing block for any
   position:fixed descendant. That is what was catching the bottom tab bar and
   holding it 68px above the bottom of the screen. The slide is not worth it. */
@keyframes scrIn{from{opacity:0}to{opacity:1}}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.tbar{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:8px;flex:0 0 auto}
.tbar h2{font-size:19px;flex:1;text-transform:uppercase}
.iconbtn{min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);transition:transform .15s var(--ease),background .15s}
.iconbtn:active{transform:scale(.93);background:var(--panel2)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-direction:column;
  min-height:52px;padding:6px 18px;border-radius:14px;font-family:var(--disp);font-weight:900;
  font-size:15px;letter-spacing:.08em;text-transform:uppercase;text-align:center;line-height:1.15;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line2);color:var(--txt);
  transition:transform .14s var(--ease),box-shadow .2s;
  box-shadow:0 6px 0 -2px rgba(0,0,0,.5),0 10px 22px rgba(0,0,0,.45);
}
.btn:active{transform:translate3d(0,3px,0);box-shadow:0 3px 0 -2px rgba(0,0,0,.5)}
.btn.primary{
  background:linear-gradient(180deg,color-mix(in srgb,var(--kx-accent) 72%,#fff),var(--kx-accent));
  color:var(--kx-accent-ink);border-color:color-mix(in srgb,var(--kx-accent) 52%,#fff);
  box-shadow:0 6px 0 -2px color-mix(in srgb,var(--kx-accent) 46%,#000),
    0 12px 28px color-mix(in srgb,var(--kx-accent) 30%,transparent),
    inset 0 1px 0 rgba(255,255,255,.45)}
.btn.hot{
  background:linear-gradient(180deg,color-mix(in srgb,var(--kx-accent-2) 78%,#fff),
    var(--kx-accent-2) 46%,var(--kx-accent-2-deep));
  color:#fff;border-color:color-mix(in srgb,var(--kx-accent-2) 55%,#fff);
  text-shadow:0 1px 2px rgba(0,0,0,.35);
  box-shadow:0 6px 0 -2px color-mix(in srgb,var(--kx-accent-2-deep) 62%,#000),
    0 12px 28px color-mix(in srgb,var(--kx-accent-2) 34%,transparent),
    inset 0 1px 0 rgba(255,255,255,.32)}
.btn.ghost{background:rgba(255,255,255,.04);box-shadow:none;border-color:var(--line)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.sm{min-height:44px;font-size:12px;padding:4px 13px;border-radius:11px}
.btn .sub{display:block;font-size:9.5px;letter-spacing:.06em;opacity:.75;font-weight:700;margin-top:3px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chip{min-height:38px;padding:0 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);
  display:inline-flex;align-items:center;gap:6px;transition:.15s var(--ease);white-space:nowrap}
.chip.on{background:var(--gold);color:#241800;border-color:#FFE9B0}
.chip b{opacity:.7}
.chip:active{transform:scale(.95)}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:3px 0 7px;scrollbar-width:none;flex:0 0 auto}
.chiprow::-webkit-scrollbar{display:none}
.field{width:100%;min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:0 14px;color:var(--txt);font-size:16px}
.field::placeholder{color:var(--dim2)}
.searchwrap{position:relative;flex:0 0 auto}
.searchwrap>.ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:17px;
  color:var(--dim2);pointer-events:none}
.searchwrap .field{padding-left:39px}
.muted{color:var(--dim);font-size:13px}
.tiny{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);font-weight:700}
.err{color:var(--bad);font-size:12.5px;font-weight:700;min-height:18px;margin:4px 0 0}

/* ══════════════════ CARD ══════════════════
   --cw MUST always be a length: font-size derives from it (calc(var(--cw)/11)),
   so a percentage would silently collapse all the text.                        */
.card{
  --cw:120px;position:relative;width:var(--cw);aspect-ratio:59/86;flex:0 0 auto;
  font-size:calc(var(--cw)/11);border-radius:calc(var(--cw)*.06);
  background:linear-gradient(160deg,var(--fc,#666),#0d0a14 62%);
  padding:calc(var(--cw)*.028);box-shadow:0 3px 10px rgba(0,0,0,.55);
  transition:transform .18s var(--ease);isolation:isolate;
}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.95)}
.card .in{
  position:absolute;inset:calc(var(--cw)*.028);border-radius:calc(var(--cw)*.045);
  background:linear-gradient(178deg,#1A1428 0%,#120E1C 55%,#0B0812 100%);
  border:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column;overflow:hidden;
}
.card .hd{display:flex;align-items:center;gap:.3em;padding:.42em .5em .1em;flex:0 0 auto}
/* Always reserve both lines. Clamping to 2 but only using 1 on short names made every
   tile a different height, so the art windows never lined up across the grid. */
.card .nm{font-family:var(--disp);font-weight:700;font-size:.9em;line-height:1.04;flex:1;
  letter-spacing:-.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  min-height:2.08em;text-shadow:0 1px 2px #000}
/* the attribute mark. Kept in the text colour with a faction-coloured glow —
   painting it in var(--fc) itself makes TROUBLE (#37474F) vanish on a dark card. */
.card .at{display:flex;align-items:center;font-size:1.2em;line-height:1;
  filter:drop-shadow(0 0 3px var(--fc)) drop-shadow(0 1px 1px rgba(0,0,0,.85))}
/* on the 46px pool-row card 1em is barely 4px — the two marks get a hard floor
   so they never shrink into an unreadable speck */
.card .at .ico{min-width:7.5px;min-height:7.5px}
.card .lv{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:.3em;
  padding:.05em .5em 0;font-size:.68em;min-height:1.25em;overflow:hidden}
.card .lv .ty{font-size:.86em;letter-spacing:.1em;font-weight:800;color:#000;background:var(--fc);
  padding:.1em .5em;border-radius:99px;text-transform:uppercase;white-space:nowrap;flex:0 0 auto;
  display:inline-flex;align-items:center;gap:.32em}
/* the type mark only earns its place on the big card — at .sm the pill text is
   already under 7px and an icon next to it is just noise */
.card:not(.lg) .lv .ty .ico{display:none}
.card .lv .sr{color:var(--gold);text-shadow:0 0 4px rgba(255,197,66,.8);letter-spacing:-.06em;
  margin-left:auto;white-space:nowrap;overflow:hidden}
.card.xs .lv .ty,.card.sm .lv .ty{display:none}
.card .art{
  flex:1 1 auto;min-height:2.4em;display:grid;place-items:center;margin:.2em .45em;border-radius:.3em;
  position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--fc) 46%,transparent) 0%,rgba(0,0,0,.55) 72%),
             linear-gradient(180deg,rgba(255,255,255,.07),transparent);
  border:1px solid rgba(255,255,255,.09);
}
.card .art span{font-size:2.85em;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.7))}
.card .tx{flex:0 0 auto;font-size:.58em;line-height:1.2;color:#B7ABD6;margin:0 .6em .1em;overflow:hidden;
  font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .ef{flex:0 0 auto;font-size:.58em;line-height:1.2;color:#7EE0A0;margin:0 .6em .14em;overflow:hidden;
  padding-top:.2em;border-top:1px dashed rgba(255,255,255,.15);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .ef:empty{display:none}
.card .st{
  flex:0 0 auto;display:flex;justify-content:space-between;gap:.3em;margin:auto .45em .45em;padding:.24em .45em;
  border-radius:.28em;background:linear-gradient(180deg,rgba(0,0,0,.66),rgba(0,0,0,.9));
  border:1px solid rgba(255,255,255,.10);font-family:var(--disp);font-size:.7em;font-weight:900;
  font-variant-numeric:tabular-nums;
}
.card .st b{color:#FF8A65}
.card .st i{color:#5CC8FF;font-style:normal}
.card .st .lbl{opacity:.55;font-size:.8em}
/* rarity mark — a solid silhouette (dot / diamond / gem / crown) in the rarity
   colour. Solid on purpose: it still reads at the 5px it gets on an .xs card. */
.card .gem{position:absolute;top:calc(var(--cw)*.05);left:calc(var(--cw)*.05);width:1em;height:1em;
  min-width:7.5px;min-height:7.5px;display:grid;place-items:center;color:var(--rc);z-index:3;
  filter:drop-shadow(0 0 4px var(--rc)) drop-shadow(0 1px 1px rgba(0,0,0,.85))}
.card .gem .ico{width:100%;height:100%}
.card.holo .in::after{
  content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.4;
  background:linear-gradient(115deg,transparent 22%,rgba(255,120,255,.55) 36%,rgba(120,255,255,.55) 44%,
    rgba(255,240,120,.5) 52%,transparent 68%);
  background-size:280% 280%;animation:holoRun 4.5s linear infinite;
}
.card.holo-leg .in::after{opacity:.6;animation-duration:3s;
  background:linear-gradient(115deg,transparent 20%,rgba(255,215,90,.85) 34%,rgba(255,255,255,.9) 43%,
    rgba(255,170,40,.8) 52%,transparent 70%);background-size:260% 260%}
@keyframes holoRun{0%{background-position:0% 50%}100%{background-position:280% 50%}}
.card.holo{box-shadow:0 3px 10px rgba(0,0,0,.55),0 0 16px -2px var(--rc)}
.card.back .in{background:repeating-linear-gradient(45deg,#241A3E 0 7px,#1B1430 7px 14px);display:grid;place-items:center}
.card.back .in::before{content:'';width:54%;aspect-ratio:1;border-radius:50%;
  background:conic-gradient(from 0deg,var(--hot),var(--neon),var(--gold),var(--hot));opacity:.85;
  -webkit-mask:radial-gradient(circle,transparent 0 30%,#000 31% 100%);
          mask:radial-gradient(circle,transparent 0 30%,#000 31% 100%)}
.card.back{background:linear-gradient(160deg,#4A3A72,#0d0a14 70%)}
.card.xs{--cw:76px}
.card.sm{--cw:min(110px,calc((100vw - 62px)/3))}
.card.md{--cw:120px}
.card.lg{--cw:min(258px,68vw)}
.card.xs .tx,.card.sm .tx,.card.xs .ef,.card.sm .ef{display:none}
.card.xs .art span{font-size:2.5em}
.card.lg .tx,.card.lg .ef{-webkit-line-clamp:3}
.card.dim{filter:grayscale(1) brightness(.42) contrast(.85)}
.cnt{position:absolute;bottom:-5px;right:-5px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;
  background:var(--gold);color:#241800;font-family:var(--disp);font-weight:900;font-size:12px;
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.6);z-index:4}
/* ── NEW: a card the player did not own before this moment ──
   A banner right across the top of the card, not a corner sticker. It is
   anchored by its BOTTOM edge to just above the card's top, so however tall it
   gets it only ever laps .35em over the frame — the card's own name starts a
   good half-em below that and stays readable. Sized in em, and .card sets
   font-size:calc(var(--cw)/11), so it scales with whatever card it is on. */
.newbadge{position:absolute;left:-.2em;right:-.2em;bottom:calc(100% - .35em);z-index:6;
  pointer-events:none;display:flex;align-items:center;justify-content:center;
  min-height:1.95em;padding:.12em .5em;border-radius:.5em;
  font-family:var(--disp);font-weight:900;font-size:1em;letter-spacing:.3em;text-indent:.3em;
  text-transform:uppercase;color:#04240F;
  background:linear-gradient(180deg,#8CFFC0,var(--ok) 52%,#12A055);
  border:1px solid rgba(255,255,255,.6);text-shadow:0 1px 0 rgba(255,255,255,.4);
  box-shadow:0 .3em .8em rgba(61,220,132,.55),0 .12em 0 rgba(0,0,0,.5);
  animation:newIn .46s var(--ease) both}
@keyframes newIn{0%{opacity:0;transform:translate3d(0,.9em,0) scale(.7)}
  62%{opacity:1;transform:translate3d(0,0,0) scale(1.07)}100%{opacity:1;transform:none}}
/* On a thumbnail the banner would be taller than the card's own title, so the
   small sizes carry the same news as a green halo instead. Same colour, same
   meaning, nothing covered. */
.card.is-new{box-shadow:0 0 0 2px var(--ok),0 0 16px -2px rgba(61,220,132,.7),
  0 3px 10px rgba(0,0,0,.55)}
/* ── DUPLICATE: the exact counterpart of NEW ──
   Same banner, same geometry, same entrance — and a deliberately different
   tone. NEW is a bright green announcement; a duplicate is not news, so it
   gets a cool, desaturated lilac-steel that is unmistakably NOT the green and
   is not competing with the gold a legendary throws around either. When the
   copy actually converted into something (you were already on the maximum
   three), the amount it converted into rides inside the banner, so the player
   is never left wondering what happened to the card.
   Everything is em-based off .card's font-size, exactly like .newbadge, so it
   scales with whatever card it lands on. */
.dupebadge{position:absolute;left:-.2em;right:-.2em;bottom:calc(100% - .35em);z-index:6;
  pointer-events:none;display:flex;align-items:center;justify-content:center;gap:.4em;
  min-height:1.95em;padding:.12em .45em;border-radius:.5em;white-space:nowrap;
  font-family:var(--disp);font-weight:900;font-size:.92em;letter-spacing:.17em;text-indent:.17em;
  text-transform:uppercase;color:#1A1230;
  background:linear-gradient(180deg,#E4DDF7,#9C8FC6 54%,#63558C);
  border:1px solid rgba(255,255,255,.55);text-shadow:0 1px 0 rgba(255,255,255,.35);
  box-shadow:0 .3em .8em rgba(99,85,140,.55),0 .12em 0 rgba(0,0,0,.5);
  animation:newIn .46s var(--ease) both}
.dupebadge i{font-style:normal;display:inline-flex;align-items:center;gap:.2em;
  letter-spacing:.04em;text-indent:0;padding:.1em .4em;border-radius:.35em;
  background:rgba(24,16,44,.8);color:#FFD979;text-shadow:none}
.dupebadge i .ico{width:1em;height:1em}
.card.is-dupe{box-shadow:0 0 0 2px #9C8FC6,0 0 15px -3px rgba(156,143,198,.75),
  0 3px 10px rgba(0,0,0,.55)}
.card.xs .newbadge,.card.sm .newbadge,
.card.xs .dupebadge,.card.sm .dupebadge{display:none}
@keyframes pop{from{transform:scale(0)}70%{transform:scale(1.25)}to{transform:scale(1)}}

/* ══════════════════ AUTH — THE ENTRY GATE ══════════════════
   The splash's festa scene, carried into the first interactive screen: the
   same painted backdrop (--kx-gate-bg), a vignette that keeps the centre calm,
   rising embers, a fanned hand of card-backs behind the wordmark, and the
   split gold/crimson logo with the splash's light sweep. Every colour reads
   a --kx-* token (see THEME TOKENS above).                                  */
#scr-auth{
  background-image:
    radial-gradient(120% 86% at 50% 30%,rgba(9,5,12,.06) 0%,rgba(9,5,12,.38) 56%,
      color-mix(in srgb,var(--kx-bg) 94%,#000) 100%),
    var(--kx-gate-bg),
    radial-gradient(120% 85% at 50% 4%,color-mix(in srgb,var(--kx-accent-2) 22%,transparent),transparent 44%),
    radial-gradient(90% 55% at 50% 104%,color-mix(in srgb,var(--kx-accent) 18%,transparent),transparent 54%),
    linear-gradient(180deg,color-mix(in srgb,var(--kx-bg-2) 42%,var(--kx-bg)),var(--kx-bg));
  background-size:cover;background-position:center;background-repeat:no-repeat;
  background-origin:border-box;overflow:hidden}
#scr-auth>*{position:relative;z-index:2}
/* .authwrap asks for flex:1 so it can centre itself, but its parent .scroll is a
   plain block, so the flex had no effect and the whole sign-in column sat jammed
   against the top of the phone with two thirds of the screen empty below it.
   Making the scroller a flex column is what actually honours that flex:1.
   `safe center` for the same reason as .homemid: a centred column that outgrows
   its box must scroll from the top, not have its head cut off. */
#scr-auth .scroll{display:flex;flex-direction:column}
.authwrap{flex:1;display:flex;flex-direction:column;
  justify-content:center;justify-content:safe center;gap:16px;max-width:420px;
  width:100%;margin:0 auto;padding:14px 0 20px}
/* the actions live on GLASS, not on bare art — one panel, one hierarchy */
#auth-body{
  background:linear-gradient(180deg,color-mix(in srgb,var(--kx-surface) 88%,#fff 4%),var(--kx-surface));
  border:1px solid color-mix(in srgb,var(--kx-ink) 16%,transparent);
  border-radius:22px;padding:18px 16px;
  backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px) saturate(1.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 24px 50px -18px rgba(0,0,0,.8)}
#scr-auth .tagline{color:color-mix(in srgb,var(--kx-accent) 46%,var(--kx-dim));
  text-shadow:0 1px 6px rgba(0,0,0,.8)}
/* ── the fanned hand behind the wordmark — the splash's deal, held still ── */
.kx-fan{position:relative;height:0;pointer-events:none;z-index:-1;opacity:.9}
.kx-fan b{position:absolute;left:50%;top:-26px;width:58px;height:82px;margin-left:-29px;
  border-radius:8px;transform-origin:50% 120%;
  background:linear-gradient(160deg,color-mix(in srgb,var(--kx-accent-2-deep) 62%,#000),
    color-mix(in srgb,var(--kx-accent-2-deep) 26%,#000) 62%,color-mix(in srgb,var(--kx-accent-2-deep) 16%,#000));
  border:1px solid color-mix(in srgb,var(--kx-accent) 55%,transparent);
  box-shadow:0 10px 22px rgba(0,0,0,.6),inset 0 0 14px color-mix(in srgb,var(--kx-accent) 13%,transparent)}
.kx-fan b::after{content:"";position:absolute;inset:7px;border-radius:5px;
  border:1px solid color-mix(in srgb,var(--kx-accent) 28%,transparent)}
.kx-fan .f1{transform:rotate(-24deg) translateY(6px)}
.kx-fan .f2{transform:rotate(-12deg) translateY(-2px)}
.kx-fan .f3{transform:rotate(0deg)  translateY(-6px)}
.kx-fan .f4{transform:rotate(12deg) translateY(-2px)}
.kx-fan .f5{transform:rotate(24deg) translateY(6px)}
/* ── EMBERS — the splash's rising motes, shared by gate and Home ── */
.kx-embers{position:absolute;inset:0;pointer-events:none;z-index:1;contain:strict}
.kx-embers i{position:absolute;bottom:-4%;width:4px;height:4px;border-radius:50%;
  background:radial-gradient(circle,var(--kx-ember),transparent 70%);
  opacity:0;animation:kxRise linear infinite}
@keyframes kxRise{0%{opacity:0;transform:translate3d(0,0,0) scale(.6)}
  12%{opacity:.9}70%{opacity:.6}100%{opacity:0;transform:translate3d(14px,-104vh,0) scale(1.25)}}
.kx-embers i:nth-child(1){left:9%;animation-duration:10s;animation-delay:-2s}
.kx-embers i:nth-child(2){left:22%;animation-duration:12.5s;animation-delay:-7s;width:3px;height:3px}
.kx-embers i:nth-child(3){left:36%;animation-duration:9s;animation-delay:-4s}
.kx-embers i:nth-child(4){left:52%;animation-duration:13s;animation-delay:-9s;width:5px;height:5px}
.kx-embers i:nth-child(5){left:64%;animation-duration:10.5s;animation-delay:-1s;width:3px;height:3px}
.kx-embers i:nth-child(6){left:78%;animation-duration:11.5s;animation-delay:-6s}
.kx-embers i:nth-child(7){left:90%;animation-duration:9.5s;animation-delay:-3s;width:3px;height:3px}
.kx-embers i:nth-child(8){left:45%;animation-duration:14s;animation-delay:-11s}
body.reduced .kx-embers,html.reduced .kx-embers{display:none}
@media (prefers-reduced-motion:reduce){.kx-embers{display:none}}
/* ── THE WORDMARK, given the splash's treatment: KAR in gold, TI in crimson,
      a light sweep every few seconds. The base .logo stays as-is for plain
      uses (IL-QASMA in the gacha); these classes only bite on the split. ── */
.logo.kx-split{position:relative;display:block;overflow:hidden;
  background:none;-webkit-background-clip:initial;background-clip:initial;color:transparent;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.55))}
.logo.kx-split .lg1,.logo.kx-split .lg2{
  -webkit-background-clip:text;background-clip:text;color:transparent}
.logo.kx-split .lg1{
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--kx-accent) 40%,#fff),
    var(--kx-accent) 45%,color-mix(in srgb,var(--kx-accent) 62%,#7A4A00));
  filter:drop-shadow(0 0 16px color-mix(in srgb,var(--kx-accent) 42%,transparent))}
.logo.kx-split .lg2{
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--kx-accent-2) 42%,#fff),
    color-mix(in srgb,var(--kx-accent-2) 88%,#fff) 45%,var(--kx-accent-2-deep));
  filter:drop-shadow(0 0 16px color-mix(in srgb,var(--kx-accent-2) 48%,transparent))}
.logo.kx-split .lg-shine{position:absolute;top:0;bottom:0;width:42%;left:-55%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-18deg);animation:kxSweep 4.2s ease-in-out 1.2s infinite}
@keyframes kxSweep{0%{left:-55%}55%,100%{left:125%}}
body.reduced .logo.kx-split .lg-shine{display:none}
@media (prefers-reduced-motion:reduce){.logo.kx-split .lg-shine{display:none}}
.userlist{display:grid;gap:8px;margin:6px 0}
.userrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:9px 12px;min-height:56px;text-align:left}
.userrow:active{transform:scale(.98)}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--disp);
  font-weight:900;font-size:16px;color:#241800;background:linear-gradient(160deg,#FFD979,var(--gold));flex:0 0 auto}
.userrow .n{flex:1;font-family:var(--disp);font-weight:700;font-size:14px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
/* ── WORDMARK, DEMOTED WHILE A FORM IS OPEN ──
   On the menu the wordmark IS the screen's title. Once a form is open the
   panel carries a head of its own, so the mark stops being the title and
   becomes a mark: smaller, tagline retired, fan scaled to match. That is
   ~35px of vertical budget handed back to the form — the difference between
   the primary button sitting above or below the fold on a 640-tall phone. */
#scr-auth.kx-form .logo{font-size:clamp(30px,9vw,42px)}
#scr-auth.kx-form .tagline{display:none}
#scr-auth.kx-form .kx-fan b{top:-17px;width:44px;height:62px;margin-left:-22px}
#scr-auth.kx-form .authwrap{gap:12px}
/* ── THE PANEL'S HEAD ──
   The form used to open with a centred 15px line that weighed the same as
   everything under it, so the panel read as one flat stack with no entry
   point. A gold disc + a title + one line of purpose gives the eye somewhere
   to land first, and says which of the two forms you are on without having
   to read the button at the bottom. */
.authhead{display:flex;align-items:center;gap:11px;margin:0 0 13px}
.authhead .disc{width:44px;height:44px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
  color:var(--kx-accent-ink);
  background:linear-gradient(160deg,color-mix(in srgb,var(--kx-accent) 80%,#fff),var(--kx-accent));
  box-shadow:0 7px 18px -6px color-mix(in srgb,var(--kx-accent) 62%,transparent),
    inset 0 1px 0 rgba(255,255,255,.55)}
.authhead .disc .ico{font-size:22px}
.authhead .ht{min-width:0}
.authhead h3{font-family:var(--disp);font-weight:900;font-size:17px;line-height:1.1;
  letter-spacing:.05em;text-transform:uppercase}
.authhead .hs{display:block;margin-top:3px;font-size:11.5px;line-height:1.35;color:var(--dim)}
/* a quiet aside, not body copy competing with the fields it sits above */
.authnote{margin:0 0 13px;padding:1px 0 1px 11px;font-size:12.5px;line-height:1.5;color:var(--dim);
  border-left:2px solid color-mix(in srgb,var(--kx-accent) 42%,transparent)}
/* the labelled rule that splits the menu into tiers, and its blank twin */
.authdiv{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.authdiv::before,.authdiv::after{content:"";height:1px;flex:1;
  background:color-mix(in srgb,var(--kx-ink) 17%,transparent)}
.authdiv span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:var(--dim2);white-space:nowrap}
.authsep{height:1px;margin:16px 0 12px;background:color-mix(in srgb,var(--kx-ink) 14%,transparent)}
/* ── PASSWORD + ITS SHOW/HIDE ──
   One unit: the control sits inside the field's own box so it can never be
   mistaken for a form action. 44x44 tap area, and the field is padded so a
   long password never runs under it. */
.pwwrap{position:relative}
.pwwrap .field{padding-right:52px}
.pweye{position:absolute;right:3px;top:50%;transform:translateY(-50%);
  width:44px;height:44px;display:grid;place-items:center;border-radius:11px;
  color:var(--dim2);transition:color .15s var(--ease),background .15s var(--ease)}
.pweye .ico{font-size:21px}
.pweye:active{background:rgba(255,255,255,.07)}
.pweye[aria-pressed="true"]{color:var(--kx-accent)}
/* the forgotten-password link, where it belongs: under the password box,
   as a link and not a third slab in a stack of identical buttons */
.authaside{display:flex;justify-content:flex-end;margin-top:2px}
.linkbtn{min-height:44px;display:inline-flex;align-items:center;padding:0 2px;
  font-size:12.5px;font-weight:700;color:color-mix(in srgb,var(--kx-accent) 72%,var(--kx-ink));
  text-decoration:underline;text-underline-offset:3px}
.linkbtn:active{opacity:.65}
/* saved names on the LOG IN page — tappable, so the copy that points at them
   is telling the truth. The full list with faces stays on the menu. */
.authchips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 13px}
.authchip{min-height:44px;max-width:100%;padding:0 13px 0 6px;border-radius:999px;
  display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  font-family:var(--disp);font-weight:700;font-size:13px;color:var(--txt);
  transition:transform .15s var(--ease)}
.authchip .avatar{width:30px;height:30px;border-radius:9px;font-size:13px}
.authchip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.authchip:active{transform:scale(.95)}
/* The medallion is 44, not the 32 it was, because the level badge inside
   the ring is suppressed below 40 by design — six-pixel digits are grit,
   not a number. So the pill grows to fit the face rather than the face
   being shrunk to fit the pill. */
.pchip{display:inline-flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:99px;padding:5px 15px 5px 5px;min-height:54px;font-weight:700;font-size:13px;max-width:66vw}
.pchip .avatar{width:44px;height:44px;font-size:18px;border-radius:12px}
/* the name is the only part allowed to ellipsis; the face never shrinks */
.pchip .pc-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:330px){.pchip .pc-nm{display:none}.pchip{padding-right:5px}}

/* ══════════════════ HOME ══════════════════
   Home is a FULL-SCREEN menu, not a scrolling page: three bands inside the
   .screen flexbox, and the middle one takes all the slack so Story Mode and
   Multiplayer land in the optical centre. Everything that could grow is sized
   against BOTH the width and the height (min(Nvw, Nvh)) so a short phone
   shrinks the type instead of pushing the nav off the bottom. */
/* TOP BAR — profile on one edge, currency chips on the other, balanced.
   space-between puts "who you are" and "what you have" on opposite sides. */
.homehead{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  gap:10px;min-height:48px}
/* the profile chip must not eat the whole bar and starve the wallet */
.homehead .pchip{max-width:none;flex:0 1 auto;min-width:0}
.homemid{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  /* Tightened: 2vh of gap between five blocks on a tall phone left the menu
     looking half empty. The online panel below takes the slack instead. */
  gap:clamp(6px,1.1vh,12px);padding:clamp(2px,0.6vh,6px) 0;
  /* Safety net only. At 390x844 and 360x640 this never overflows — but a huge
     Dynamic-Type setting or a very short landscape window must scroll, never clip. */
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  /* `safe` matters: a plain centred flex column that overflows pushes its first
     child off the TOP of the scroll box, where it can never be scrolled back to.
     That is what was beheading the logo on a short screen. */
  /* Centred and STATIC. The forced-scroll experiment (a tall spacer after Party
     Games) was tried and reverted: it did not help the iOS gap and it put a
     large empty tail under the menu, which read as an even bigger gap. Nothing
     here should move. */
  justify-content:center;justify-content:safe center;
}
.homemid::-webkit-scrollbar{display:none}
.brand{flex:0 0 auto}
.homemid>.menu{flex:0 0 auto}
#scr-home .logo{font-size:clamp(34px,min(13vw,8vh),64px)}
/* the wallet lives in the top bar now: right-aligned, one row, never wraps */
#scr-home .wallet{margin:0;flex:0 0 auto;justify-content:flex-end;flex-wrap:nowrap;gap:8px}
#scr-home .menu{margin:0;flex:0 0 auto}

/* ── THE BIG DOORS — horizontal AAA menu rows ──────────────────────────
   An icon medallion on the left, a left-aligned title over its one-line
   pitch, a quiet chevron on the right. The colour story is unchanged —
   Story is the crimson door, Multiplayer the gold one, Party glass — it is
   the SHAPE that got the production value: a proper grid, a bevel, a glow. */
#scr-home .btn.pick{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  column-gap:12px;text-align:left;min-height:68px;padding:8px 12px 8px 10px;
  border-radius:17px}
#scr-home .btn.pick .pk-ic{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 55%,rgba(0,0,0,.18));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.25),
    0 3px 8px rgba(0,0,0,.3)}
#scr-home .btn.pick .pk-ic .ico{font-size:24px}
#scr-home .btn.pick .pk-tx{display:flex;flex-direction:column;gap:3px;min-width:0}
#scr-home .btn.pick .pk-t{font-size:16px;letter-spacing:.07em;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scr-home .btn.pick .sub{margin:0;font-size:10px;letter-spacing:.05em;opacity:.82;
  text-transform:none;font-family:var(--body);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scr-home .btn.pick .pk-go{width:19px;height:19px;stroke:currentColor;fill:none;
  stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:.65;flex:0 0 auto}
/* the glass door (Party Games + anything a module appends, e.g. How to play) */
#scr-home .btn.ghost{
  background:linear-gradient(180deg,color-mix(in srgb,var(--kx-surface) 88%,#fff 5%),var(--kx-surface));
  border-color:color-mix(in srgb,var(--kx-ink) 17%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 24px -12px rgba(0,0,0,.7)}
#scr-home .btn.ghost .pk-ic{
  background:linear-gradient(180deg,color-mix(in srgb,var(--kx-accent) 30%,transparent),
    color-mix(in srgb,var(--kx-accent) 10%,transparent));
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--kx-accent) 40%,transparent),
    inset 0 0 12px color-mix(in srgb,var(--kx-accent) 18%,transparent)}
#scr-home .btn.ghost .pk-go{color:var(--kx-accent)}
/* the tutor module appends a compact "How to play" — keep it a slim glass row */
#scr-home .menu .btn.sm{flex-direction:row;justify-content:center;min-height:44px;
  border-radius:13px;background:color-mix(in srgb,var(--kx-surface) 72%,transparent);
  border-color:color-mix(in srgb,var(--kx-ink) 14%,transparent);box-shadow:none}

/* ── the profile chip + tagline pick up the glass + accent story ── */
#scr-home .pchip{
  background:linear-gradient(180deg,color-mix(in srgb,var(--kx-surface) 88%,#fff 4%),var(--kx-surface));
  border-color:color-mix(in srgb,var(--kx-ink) 16%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 6px 16px -8px rgba(0,0,0,.65)}
#scr-home .tagline{color:color-mix(in srgb,var(--kx-accent) 40%,var(--kx-dim));
  letter-spacing:.3em;margin-top:6px}

/* ── CURRENCY CHIPS — compact, premium, icon + value only ──────────────
   No word labels: a coin icon and a dust icon carry the meaning, the way
   real games do it. A subtle inner sheen and a coloured icon make each chip
   read as a token rather than a label. Tabular figures so the numbers never
   jitter the layout as they change. */
#scr-home .wallet .pill{
  gap:5px;padding:6px 11px 6px 8px;border-radius:99px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--kx-surface) 90%,#fff 5%),var(--kx-surface));
  border:1px solid color-mix(in srgb,var(--kx-ink) 15%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 8px rgba(0,0,0,.35);
  font-size:13px;letter-spacing:.01em}
#scr-home .wallet .pill .ico{font-size:1.32em}
#scr-home .wallet .pill.coins .ico{color:color-mix(in srgb,var(--kx-accent) 88%,#fff)}
#scr-home .wallet .pill.dust .ico{color:#8FD3FF}
/* THE PAINTED CURRENCY, in the pill. Slightly oversized and pulled out of the
   pill's left edge so the coin/chip reads as a real object sitting in it
   rather than a flat glyph boxed inside. */
#scr-home .wallet .pill .curpill{width:22px;height:22px;object-fit:contain;display:block;
  margin:-4px -1px -4px -2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.curpill{width:20px;height:20px;object-fit:contain;vertical-align:-4px}
#scr-home .wallet .pill small{display:none}   /* icon says it; no word needed */

/* ── CARDS CHIP — the collection door ──────────────────────────────────
   The "54/200 cards" indicator, now a tappable route to the Collection. A
   chevron marks it as a destination; a gold hairline lifts it off the art. */
.cardschip{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;
  align-self:center;min-height:40px;padding:7px 12px 7px 13px;border-radius:99px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--kx-surface) 90%,#fff 4%),var(--kx-surface));
  border:1px solid color-mix(in srgb,var(--kx-accent) 34%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 4px 14px rgba(0,0,0,.34);
  color:var(--kx-ink);font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.02em;
  transition:transform .12s var(--ease),border-color .16s,box-shadow .16s}
.cardschip .ico{font-size:18px;color:var(--kx-accent)}
.cardschip .cc-txt small{font-family:var(--body);font-weight:600;color:var(--kx-dim);
  font-size:10.5px;letter-spacing:.05em;margin-left:2px}
.cardschip .cc-go{width:16px;height:16px;stroke:var(--kx-accent);fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85;margin-left:1px}
.cardschip:active{transform:scale(.97);border-color:color-mix(in srgb,var(--kx-accent) 60%,transparent)}

/* ── DAILY SPIN — a COMPACT badge under the avatar ─────────────────────
   Not a bar: a small pill that sits directly beneath the profile chip in the
   top-left, and ONLY when a free spin is waiting. When today's spin is claimed
   the badge is not rendered at all (renderHome empties #spin-slot), which keeps
   the corner clean and the home column short. */
.headleft{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.spin-slot{display:flex}                 /* empty (0 height) when claimed */
.spin-slot:empty{display:none}
.spinbadge{display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px 5px 5px;border-radius:99px;
  background:
    radial-gradient(120% 160% at 16% 50%,color-mix(in srgb,var(--kx-accent) 28%,transparent),transparent 62%),
    linear-gradient(180deg,color-mix(in srgb,var(--kx-surface) 92%,#fff 4%),var(--kx-surface));
  border:1px solid color-mix(in srgb,var(--kx-accent) 55%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 14px -6px color-mix(in srgb,var(--kx-accent) 70%,transparent);
  color:color-mix(in srgb,var(--kx-accent) 30%,var(--kx-ink));font-family:var(--disp);font-weight:900;font-size:12px;letter-spacing:.04em;
  white-space:nowrap;transition:transform .12s var(--ease),box-shadow .2s}
.spinbadge:active{transform:scale(.96)}
/* the little wheel medallion — the spin-wheel.png art drops in over the star */
.spinbadge .ds-art{flex:0 0 auto;width:26px;height:26px;border-radius:50%;position:relative;
  display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--kx-accent) 40%,#fff),
    var(--kx-accent) 46%,color-mix(in srgb,var(--kx-accent) 55%,#5B2E00));
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--kx-accent) 60%,#fff 20%),0 3px 8px -3px color-mix(in srgb,var(--kx-accent) 80%,transparent)}
.spinbadge .ds-art .ds-star{width:16px;height:16px;color:var(--kx-accent-ink)}
.spinbadge .ds-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spinbadge .ds-label{line-height:1}
/* READY: a slow breathing glow so the free reward catches the eye */
.spinbadge{animation:spGlow 2.4s ease-in-out infinite}
@keyframes spGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 10px -6px color-mix(in srgb,var(--kx-accent) 50%,transparent)}
  50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 5px 16px -5px color-mix(in srgb,var(--kx-accent) 95%,transparent)}}
body.reduced .spinbadge{animation:none}

/* ── HOME HERO BACKDROP ────────────────────────────────────────────────
   When art/ui/home-hero.webp is present, detectArt() in js/game.js proves it
   loaded and adds html.has-hero. That swaps the home backdrop to the hero art
   with a scrim on top so the centre stays calm and the buttons read. If the
   file is absent the class is never added and #scr-home keeps its existing
   --art-home (home-bg.jpg → designed gradient) — graceful fallback, no hole.
   This overrides css/extra.css because this <style> block loads after it. */
html.has-hero #scr-home{
  background-image:
    linear-gradient(180deg,rgba(10,7,20,.42) 0%,rgba(10,7,20,.16) 26%,rgba(10,7,20,.30) 60%,rgba(8,5,16,.82) 100%),
    var(--kx-home-bg,none),   /* the theme hook outranks the hero art too */
    var(--home-hero,none),
    var(--art-home);
  background-size:cover,cover,cover,cover;
  background-position:center top,center top,center top,center top;
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat}
.fineprint{flex:0 0 auto;text-align:center;margin:clamp(5px,1.2vh,12px) 0 0;
  font-size:10.5px;line-height:1.5;color:var(--dim2)}

/* ══════════════════ BOTTOM NAV (tab bar) ══════════════════
   Home's secondary destinations used to be a wrapped row of five ghost buttons
   that took two ragged lines and vanished into the background art. This is a
   proper app tab bar: ONE row of equal columns that can never wrap (grid
   auto-columns, not flex-wrap), bled out to the screen edges with negative
   margins that exactly undo .screen's padding, and given its own opaque surface
   so it is legible over anything.
   The bottom padding carries the safe-area inset, so on a notched phone the
   bar's SURFACE runs under the home indicator while its TAPPABLE tabs stop
   above it. */
/* Anchored to the bottom of the 100dvh shell. The background runs to the
   bottom edge of the visible viewport while padding-bottom carries
   env(safe-area-inset-bottom) so the tappable row clears the home indicator.
   No standalone special case.
   Do NOT put transform, filter, backdrop-filter or will-change on any ANCESTOR
   of this element — each creates a containing block and drags a fixed child off
   the bottom. That has bitten this file before. */
/* Set by the probe in the shell script below. On an icon that was installed while
   the legacy apple-mobile-web-app metas were present, iOS gives the page a WebView
   a status-bar shorter than the screen. The strip it leaves underneath is painted
   with the page background — the same colour as this bar — and already contains the
   home indicator. Reserving var(--sab) inside the page as well pushes the icons up
   and makes that strip read as an empty gap. So in that case only, the bar takes a
   small flat pad and lets the strip be the clearance. A normally-installed icon,
   where the WebView reaches the bottom, keeps the full inset. */
html.short-webview .tabbar{ padding-bottom:8px }
/* THE BAR ITSELF — glass over the festa, not a flat black strip. The fill,
   the accent hairline and the warm under-glow all read theme tokens
   (--kx-tab-bg / --kx-tab-on / --kx-glow), so a cosmetic repaints the whole
   bar by rewriting three variables. */
.tabbar{
  position:absolute;bottom:0;left:0;right:0;z-index:200;
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:stretch;gap:2px;
  transform:translateZ(0);-webkit-transform:translateZ(0);
  padding:6px calc(var(--sar) + 6px) calc(var(--sab) + 5px) calc(var(--sal) + 6px);
  background:
    radial-gradient(70% 130% at 50% 118%,var(--kx-glow),transparent 62%),
    linear-gradient(180deg,color-mix(in srgb,var(--kx-tab-bg) 82%,transparent),var(--kx-tab-bg) 58%);
  border-top:1px solid color-mix(in srgb,var(--kx-tab-on) 32%,transparent);
  box-shadow:0 -1px 0 rgba(255,255,255,.06) inset,
    0 -18px 40px -20px color-mix(in srgb,var(--kx-tab-on) 45%,transparent),
    0 -12px 30px rgba(0,0,0,.55);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
}
.tab{
  position:relative;min-width:0;   /* min-width:0 or a long label stretches its column */
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-height:52px;padding:7px 1px 5px;border-radius:14px;
  /* NOT the Orbitron display face here: "COLLECTION" in Orbitron is far too wide
     for a quarter of a 390px screen and got ellipsised. The UI face reads better
     at 9px anyway — this is chrome, not branding. */
  font-family:var(--body);font-weight:700;font-size:9px;letter-spacing:.02em;
  /* brighter than --dim: this is 9px type on a near-black bar and he has
     complained before about not being able to read the menu */
  /* --kx-tab-ink is only ever set by a tab COLOUR (a light tint needs dark
     labels); unset, both rules fall back to their stock mixes untouched. */
  text-transform:uppercase;line-height:1;
  color:var(--kx-tab-ink,color-mix(in srgb,var(--kx-dim) 78%,var(--kx-ink)));
  transition:color .16s var(--ease),background .16s var(--ease),transform .12s var(--ease);
}
.tab .ico{font-size:21px;color:var(--kx-tab-ink,color-mix(in srgb,var(--kx-ink) 92%,transparent));
  transition:color .16s var(--ease),filter .16s var(--ease)}
.tab .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab:active{transform:translate3d(0,1px,0);background:color-mix(in srgb,var(--kx-ink) 9%,transparent)}
/* the current destination: a lit tab, not a paint bucket — the icon and label
   take the accent with a soft halo, a glow pools behind the tab, and a small
   bar over the icon marks the spot. Nothing is current while you are on Home
   itself — that is correct, Home is not one of the three. */
.tab[aria-current]{color:var(--kx-tab-on);
  background:
    radial-gradient(60% 90% at 50% 0%,color-mix(in srgb,var(--kx-tab-on) 22%,transparent),transparent 72%),
    color-mix(in srgb,var(--kx-tab-on) 7%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--kx-tab-on) 26%,transparent),
    0 6px 18px -8px color-mix(in srgb,var(--kx-tab-on) 60%,transparent)}
.tab[aria-current] .ico{color:var(--kx-tab-on);
  filter:drop-shadow(0 0 7px color-mix(in srgb,var(--kx-tab-on) 65%,transparent))}
.tab[aria-current]::after{content:'';position:absolute;top:2px;left:50%;
  transform:translateX(-50%);width:22px;height:3px;border-radius:99px;
  background:var(--kx-tab-on);box-shadow:0 0 9px var(--kx-tab-on)}
/* "your deck is not legal" — a badge, because a tab bar must never reflow */
/* pinned to the icon's top-right, NOT to the tab's, so it stays put whatever
   width the column ends up being */
.tdot{position:absolute;top:4px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;
  background:var(--hot);border:1.5px solid #0B0716;box-shadow:0 0 8px rgba(232,69,44,.9)}
.tdot[hidden]{display:none}
/* ══ UPDATE STRIP (+ opt-in diagnostic) ══════════════════════════════════════
   Sits in the strip directly ABOVE the bar (bottom:100% of the fixed .tabbar),
   so it costs zero layout space and never touches the home indicator.

   Normally EMPTY and invisible. It has exactly one job for a player: when a
   newer build is deployed it becomes the gold tap-to-update strip below.
   The version + geometry readout it used to print on every phone is now
   opt-in only (?diag=1 — see buildTag() at the end of this file). */
#buildtag{position:absolute;bottom:100%;left:0;right:0;margin:0;
  padding:3px 10px;text-align:center;pointer-events:none;
  font:600 9px/1.3 var(--body);letter-spacing:.07em;text-transform:uppercase;
  color:rgba(244,239,255,.55);text-shadow:0 1px 3px rgba(0,0,0,.9)}
/* second line: live geometry, so a screenshot of the phone answers "what does
   THIS device think the viewport is". Tabular figures so the numbers do not
   jitter sideways as they change; still zero layout cost (the whole strip is
   absolutely positioned above the fixed bar). */
#buildtag .geo{display:block;margin-top:1px;font-size:8px;letter-spacing:.03em;
  text-transform:none;opacity:.72;font-variant-numeric:tabular-nums}
#buildtag.upd .geo{display:none}
/* an update really is waiting: turn into a tappable strip you cannot miss */
#buildtag.upd{pointer-events:auto;cursor:pointer;padding:8px 10px;
  font-size:11px;font-weight:800;color:#241800;text-shadow:none;
  background:linear-gradient(180deg,#FFDE8B,var(--gold));
  border-top:1px solid #FFE9B0;box-shadow:0 -6px 18px rgba(255,197,66,.35)}
/* ══ END BUILD TAG ══ */

/* ══════════════════ LIGHT THEME (html.kx-light) ══════════════════
   Everything below only bites while a LIGHT theme (Roża Ħelwa) is equipped —
   applyKx() puts .kx-light on <html> for any theme flagged light:1 and takes
   it off again on unequip, so stock stays byte-identical. These rules re-aim
   the handful of surfaces that hard-code a dark field: the scrims (a dark
   veil over a baby-pink scene reads as mud — it becomes a pale rose veil that
   keeps DARK ink legible instead), the gold-gradient wordmark (baby pink on
   baby pink is invisible; it deepens to rose, measured 4.66:1 on the field),
   and the places that use the accent as TEXT on the field, where the light
   accent that is perfect as a button FILL is too pale as ink. */
html.kx-light body::before{opacity:.10;
  background:repeating-linear-gradient(180deg,rgba(70,16,44,.05) 0 1px,transparent 1px 3px)}
html.kx-light .logo:not(.kx-split){
  background:linear-gradient(180deg,#E0447F,#C2255C 45%,#8E1B44);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.55)) drop-shadow(0 6px 14px rgba(194,37,92,.28))}
html.kx-light .logo.kx-split .lg1{
  background-image:linear-gradient(180deg,#F286B2,#D6336C 45%,#A61E4D);
  filter:drop-shadow(0 0 14px rgba(214,51,108,.35))}
html.kx-light .logo.kx-split .lg2{
  background-image:linear-gradient(180deg,#E0447F,#C2255C 45%,#8E1B44);
  filter:drop-shadow(0 0 14px rgba(166,30,77,.4))}
html.kx-light #scr-home::before{background:
  radial-gradient(110% 42% at 50% -8%,var(--kx-glow),transparent 60%),
  radial-gradient(96% 36% at 50% 112%,var(--kx-glow),transparent 64%),
  linear-gradient(180deg,rgba(255,240,246,.62),rgba(255,240,246,.34) 30%,
    rgba(255,236,244,.44) 64%,rgba(252,228,238,.74))}
html.kx-light.has-hero #scr-home{background-image:
  linear-gradient(180deg,rgba(255,240,246,.55),rgba(255,240,246,.28) 26%,
    rgba(255,240,246,.38) 60%,rgba(252,228,238,.72)),
  var(--kx-home-bg,none),var(--home-hero,none),var(--art-home)}
html.kx-light #scr-home .logo,html.kx-light #scr-home .tagline{
  text-shadow:0 1px 8px rgba(255,255,255,.65)}
html.kx-light #scr-auth{background-image:
  radial-gradient(120% 86% at 50% 30%,rgba(255,244,248,.10) 0%,rgba(255,236,244,.46) 56%,
    var(--kx-bg) 100%),
  var(--kx-gate-bg),
  radial-gradient(120% 85% at 50% 4%,color-mix(in srgb,var(--kx-accent-2) 16%,transparent),transparent 44%),
  radial-gradient(90% 55% at 50% 104%,color-mix(in srgb,var(--kx-accent) 22%,transparent),transparent 54%),
  linear-gradient(180deg,color-mix(in srgb,var(--kx-bg-2) 42%,var(--kx-bg)),var(--kx-bg))}
/* accent-as-INK spots: the fill accent is too pale as text on the pink field */
html.kx-light .cardschip .ico{color:#C2255C}
html.kx-light .cardschip .cc-go{stroke:#C2255C}
html.kx-light .cardschip{border-color:rgba(194,37,92,.38)}
html.kx-light #buildtag{color:rgba(70,16,44,.55);text-shadow:none}
html.kx-light :focus-visible{outline-color:#C2255C}
