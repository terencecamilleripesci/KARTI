/* Short phones (iPhone SE, 360x640 Androids). The two fat rows are the wallet
   and the secondary nav — both wrap to THREE lines at 360px on the normal
   scale. Tightening the type and the padding puts each back to two lines and
   buys back ~115px, which is what makes the whole menu fit with no scrollbar.
   Touch targets stay at 40px; nothing is hidden. */
@media (max-height:700px){
  .homemid{gap:7px}
  #scr-home .btn.pick{min-height:56px;padding:6px 10px 6px 8px}
  #scr-home .btn.pick .pk-ic{width:38px;height:38px;border-radius:11px}
  #scr-home .btn.pick .pk-ic .ico{font-size:20px}
  #scr-home .btn.pick .pk-t{font-size:14px}
  #scr-home .btn.pick .sub{font-size:9px}
  .fineprint{font-size:9.5px}
  #scr-home .tagline{font-size:9.5px;letter-spacing:.2em}
  #scr-home .wallet{gap:6px}
  #scr-home .wallet .pill{font-size:12px;padding:5px 9px 5px 7px;gap:4px}
  /* the cards chip shrinks a touch so the whole column still fits with no
     scroll on a 360x640 phone */
  .cardschip{min-height:36px;padding:6px 11px;font-size:12px}
  /* the spin badge under the avatar shrinks too — it shares the fixed top bar */
  .spinbadge{font-size:11px;padding:4px 10px 4px 4px;gap:6px}
  .spinbadge .ds-art{width:23px;height:23px}
  .spinbadge .ds-art .ds-star{width:14px;height:14px}
  /* the tab bar is already one row; just tighten it — 48px still clears the
     44px minimum target, and no label is dropped */
  .tabbar{margin-top:7px;gap:1px}
  .tab{min-height:48px;gap:4px;padding:5px 1px 4px;font-size:8.5px;letter-spacing:0}
  .tab .ico{font-size:19px}
  #scr-home .onlinebox{padding:7px 9px 6px;gap:6px}
  #scr-home .on-list{max-height:clamp(58px,17vh,120px)}
  /* Cap the WHOLE online box on a short phone so its content (including the
     server-unreachable explanation, which is the tallest state) scrolls INSIDE
     the box rather than pushing content off the bottom. Keeps the home column
     fitting with no page scroll even in the worst online state. */
  #scr-home .onlinebox{max-height:clamp(74px,13vh,120px);overflow-y:auto;scrollbar-width:none}
  #scr-home .onlinebox::-webkit-scrollbar{display:none}
  #scr-home .menu{gap:8px}
}
.logo{font-family:var(--disp);font-weight:900;font-size:clamp(42px,13vw,64px);line-height:.9;
  letter-spacing:.06em;text-align:center;
  background:linear-gradient(180deg,#FFF3CF,var(--gold) 45%,#C77A00);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #6E3B00) drop-shadow(0 8px 18px rgba(255,180,40,.35))}
.tagline{text-align:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin:4px 0 0}
.wallet{display:flex;gap:7px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:99px;padding:7px 12px;font-family:var(--disp);font-weight:700;font-size:12.5px;white-space:nowrap}
.pill small{font-family:var(--body);font-weight:600;color:var(--dim);font-size:10.5px;letter-spacing:.05em}
.decksel{display:flex;gap:9px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.decksel::-webkit-scrollbar{display:none}
.deckcard{
  flex:0 0 auto;width:116px;min-height:126px;border-radius:16px;padding:11px 7px;text-align:center;
  position:relative;overflow:hidden;
  background:linear-gradient(170deg,color-mix(in srgb,var(--dc) 34%,#160F26),#120C1E);
  border:2px solid transparent;transition:transform .18s var(--ease),border-color .18s;
}
.deckcard.on{border-color:var(--dc);box-shadow:0 0 22px -4px var(--dc),inset 0 0 30px -12px var(--dc)}
.deckcard:active{transform:scale(.96)}
.deckcard .e{font-size:28px;line-height:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.deckcard .n{font-family:var(--disp);font-weight:900;font-size:13px;letter-spacing:.04em;margin-top:5px}
.deckcard .vs{font-size:9.5px;line-height:1.4;margin-top:5px;color:var(--dim)}
.deckcard .vs b{color:var(--ok)}
.deckcard .vs i{color:var(--bad);font-style:normal}
.decktag{text-align:center;font-size:12.5px;color:var(--dim);min-height:34px;padding:6px 6px 0;font-style:italic}
.menu{display:grid;gap:10px;margin-top:4px}

/* ══════════════════ PACK ══════════════════ */
#scr-pack{padding:0;overflow:hidden}
.packwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--sat) + 8px) 12px calc(var(--sab) + 8px)}
.stage{perspective:1000px;perspective-origin:50% 45%;width:100%;flex:1;display:grid;place-items:center;
  position:relative;min-height:0}
.pack{position:relative;width:min(206px,54vw);aspect-ratio:5/7.6;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .12s linear;will-change:transform;cursor:pointer}
.pack .fc{position:absolute;inset:0;border-radius:9px;overflow:hidden;backface-visibility:hidden}
.pack .front{transform:translateZ(9px);
  background:linear-gradient(158deg,#3A1E6B 0%,#7B1F4A 42%,#B5451B 72%,#2A1140 100%);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 0 40px rgba(0,0,0,.55),0 22px 50px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px}
.pack .back2{transform:translateZ(-9px) rotateY(180deg);
  background:linear-gradient(158deg,#241241,#4A1130);border:1px solid rgba(255,255,255,.14)}
.pack .side{position:absolute;top:0;bottom:0;width:18px;background:linear-gradient(90deg,#1B0E33,#502054,#1B0E33)}
.pack .sL{left:-9px;transform:rotateY(-90deg)}
.pack .sR{right:-9px;transform:rotateY(90deg)}
.pack .foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.85;
  background:linear-gradient(105deg,transparent 26%,rgba(255,255,255,.10) 38%,rgba(190,255,255,.75) 46%,
    rgba(255,190,255,.6) 51%,rgba(255,235,150,.55) 57%,transparent 72%);
  background-size:320% 100%;animation:foilRun 3.4s linear infinite}
@keyframes foilRun{0%{background-position:120% 0}100%{background-position:-220% 0}}
.pack .plogo{font-family:var(--disp);font-weight:900;font-size:31px;letter-spacing:.1em;
  background:linear-gradient(180deg,#FFF6D8,#FFC542 50%,#B96C00);-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 2px 0 #5B2E00)}
.pack .psub{font-size:8px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.82);
  text-align:center;line-height:1.7}
.pack .pemo{font-size:38px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.pack .pcount{position:absolute;bottom:12px;font-family:var(--disp);font-weight:900;font-size:10px;
  letter-spacing:.16em;color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.4);
  padding:3px 9px;border-radius:99px}
/* ── the charge: half a second of "something is about to happen" before the
   tear. The pack pulls in on itself and the foil rakes faster — no new
   elements, no layout, transform + opacity only. */
.pack.charge{animation:pkCharge .52s cubic-bezier(.4,0,.6,1) both}
@keyframes pkCharge{0%{transform:scale(1)}70%{transform:scale(.94)}100%{transform:scale(.965)}}
.pack.charge .foil{animation-duration:.42s;opacity:1}
.pack.shake{animation:pkShake .45s var(--ease)}
@keyframes pkShake{0%,100%{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
  15%{transform:rotate(-4deg) scale(1.04)}38%{transform:rotate(5deg) scale(1.05)}
  60%{transform:rotate(-3deg) scale(1.03)}82%{transform:rotate(2deg) scale(1.02)}}
/* the seam itself splitting — a hot line of light down the tear strip, timed to
   land on the frame the lid lets go. One element, scaleY + opacity. */
.pack .seam{position:absolute;left:-2px;right:-2px;top:calc(23% - 2px);height:3px;
  transform:translateZ(12px) scaleX(.1);opacity:0;border-radius:2px;
  background:linear-gradient(90deg,transparent,#fff 18%,var(--fxc,#FFD24A) 50%,#fff 82%,transparent);
  box-shadow:0 0 14px var(--fxc,#FFD24A)}
.pack.tearing .seam{animation:seamGo .5s var(--ease) forwards}
@keyframes seamGo{0%{opacity:0;transform:translateZ(12px) scaleX(.1) scaleY(1)}
  22%{opacity:1;transform:translateZ(12px) scaleX(1) scaleY(2.6)}
  100%{opacity:0;transform:translateZ(12px) scaleX(1.1) scaleY(1)}}
.pack .lid{position:absolute;left:-2px;right:-2px;top:-2px;height:23%;transform:translateZ(11px);
  background:linear-gradient(158deg,#4B2680,#8A2352);border-radius:9px 9px 0 0;
  clip-path:polygon(0 0,100% 0,100% 68%,92% 100%,84% 66%,76% 100%,68% 66%,60% 100%,52% 66%,44% 100%,
    36% 66%,28% 100%,20% 66%,12% 100%,4% 66%,0 96%);
  border:1px solid rgba(255,255,255,.25);border-bottom:0;
  display:grid;place-items:center;font-size:8px;letter-spacing:.26em;color:rgba(255,255,255,.75);
  font-weight:800;padding-bottom:12%}
.pack.tearing .lid{animation:lidFly .75s var(--ease) forwards}
@keyframes lidFly{to{transform:translate3d(20px,-190px,80px) rotate(28deg);opacity:0}}
.pack.tearing .front,.pack.tearing .back2,.pack.tearing .side{animation:pkGone .6s .2s var(--ease) forwards}
@keyframes pkGone{to{transform:translateZ(0) scale(.55);opacity:0}}
/* The burst and the rays are tinted by --fxc, which JS sets to the colour of
   the BEST card in the pack before the tear runs. Gold light coming out of the
   seam is the tell that something good is in there — the whole build-up. */
.burst{position:absolute;left:50%;top:48%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  pointer-events:none;opacity:0;z-index:5;
  background:radial-gradient(circle,#fff 0 22%,var(--fxc,#FFD24A) 40%,rgba(255,150,60,0) 72%)}
.burst.go{animation:burstGo .85s var(--ease) forwards}
@keyframes burstGo{0%{opacity:1;transform:scale(.2)}55%{opacity:1}100%{opacity:0;transform:scale(34)}}
.rays{position:absolute;left:50%;top:48%;width:340px;height:340px;margin:-170px 0 0 -170px;pointer-events:none;
  opacity:0;z-index:4;background:conic-gradient(from 0deg,var(--fxc,#FFD24A) 0 3deg,transparent 3deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
.rays.go{animation:raysGo 1.1s var(--ease) forwards}
@keyframes raysGo{0%{opacity:0;transform:scale(.3) rotate(0)}30%{opacity:.9}100%{opacity:0;transform:scale(2.1) rotate(140deg)}}

/* ══════════════════ THE REVEAL FX LAYER ══════════════════
   Five effects, all living on the stage rather than on the card, all driven by
   one custom property (--fxc, the colour of whatever is being revealed) so a
   single assignment re-tints the lot. Every one of them animates ONLY transform
   and opacity: nothing here can trigger layout, and nothing here is an ancestor
   of the tab bar. They are inert (opacity:0, no animation) until JS adds .on,
   and a screen that is display:none runs no animations at all, so none of this
   costs anything once you leave the pack.
     wash     a colour bloom plus a vignette that darkens everything else
     beam     a shaft of light standing behind the card
     streaks  speed stripes converging on the card during the wind-up
     ring     a shockwave leaving the card at the moment it lands
     flash    a single frame of white — legendary only */
.fxback,.fxtop{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fxback{z-index:2}
.fxtop{z-index:40}
.fxback>*,.fxtop>*{position:absolute;opacity:0}

.fxwash{inset:-25%;
  background:radial-gradient(ellipse at 50% 46%,var(--fxc,#FFD24A) 0%,transparent 56%),
             radial-gradient(ellipse at 50% 46%,transparent 24%,rgba(6,4,12,.9) 74%)}
.fxwash.on{animation:washGo var(--fxdur,1.6s) var(--ease) forwards}
@keyframes washGo{0%{opacity:0}18%{opacity:.42}70%{opacity:.38}100%{opacity:0}}

/* Deliberately soft. A first pass had a pure-white core and it read as a
   fluorescent tube standing behind the card rather than as light — at this
   size a blown-out highlight is just a white stripe.
   No mix-blend-mode, on purpose. It looked marginally richer, and it cost
   about a quarter of the dropped frames in the legendary reveal all by itself:
   a blended layer has to read the backdrop back every frame instead of being
   composited. At these opacities plain alpha is indistinguishable. */
.fxbeam{left:50%;top:-32%;width:300px;height:164%;margin-left:-150px;
  background:linear-gradient(90deg,transparent,
    color-mix(in srgb,var(--fxc,#FFD24A) 40%,transparent) 30%,
    var(--fxc,#FFD24A) 50%,
    color-mix(in srgb,var(--fxc,#FFD24A) 40%,transparent) 70%,transparent);
  -webkit-mask:linear-gradient(180deg,transparent,#000 32%,#000 68%,transparent);
          mask:linear-gradient(180deg,transparent,#000 32%,#000 68%,transparent)}
.fxbeam.on{animation:beamGo var(--fxdur,1.6s) var(--ease) forwards}
@keyframes beamGo{0%{opacity:0;transform:scaleX(.08) scaleY(.5)}
  16%{opacity:.62;transform:scaleX(1) scaleY(1)}
  62%{opacity:.36;transform:scaleX(.82) scaleY(1)}
  100%{opacity:0;transform:scaleX(.44) scaleY(1)}}

/* THE STRIPES. A single repeating-conic-gradient masked into a ring, scaled
   down towards the card so the lines read as energy rushing inward. */
.fxstreaks{left:50%;top:46%;width:560px;height:560px;margin:-280px 0 0 -280px;
  background:repeating-conic-gradient(from 0deg,transparent 0 3.4deg,
    var(--fxc,#FFD24A) 3.4deg 4.2deg,transparent 4.2deg 8.4deg);
  -webkit-mask:radial-gradient(circle,transparent 20%,#000 38%,#000 60%,transparent 76%);
          mask:radial-gradient(circle,transparent 20%,#000 38%,#000 60%,transparent 76%)}
.fxstreaks.on{animation:strGo var(--fxdur,.9s) cubic-bezier(.32,0,.2,1) forwards}
@keyframes strGo{0%{opacity:0;transform:scale(2.5) rotate(-22deg)}
  26%{opacity:.75}80%{opacity:.55}100%{opacity:0;transform:scale(.5) rotate(9deg)}}

.fxring{left:50%;top:46%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  border:3px solid var(--fxc,#FFD24A);box-shadow:0 0 26px var(--fxc,#FFD24A)}
.fxring.on{animation:ringGo .8s cubic-bezier(.16,.84,.3,1) forwards}
@keyframes ringGo{0%{opacity:0;transform:scale(.18)}10%{opacity:.95}100%{opacity:0;transform:scale(3.6)}}

.fxflash{inset:0;background:radial-gradient(circle at 50% 46%,#fff 0%,var(--fxc,#FFD24A) 32%,transparent 72%)}
.fxflash.on{animation:flashGo .52s ease-out forwards}
@keyframes flashGo{0%{opacity:0}9%{opacity:.9}100%{opacity:0}}

.hint{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);text-align:center;margin:0;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.fan{position:absolute;inset:0;display:grid;place-items:center;z-index:6}
/* An ambient bloom under the stack, in the colour of the best card in the
   pack. It is the same tell as the tear light, held quietly under the deck for
   as long as there are cards left to turn: the player is looking at gold
   before they turn anything over. One element, one slow opacity/scale cycle. */
.fan::before{content:'';position:absolute;left:50%;top:50%;width:300px;height:300px;
  margin:-150px 0 0 -150px;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,var(--fxc,#FFD24A) 0%,transparent 62%);
  opacity:.16;animation:fanGlow 3.2s ease-in-out infinite}
@keyframes fanGlow{0%,100%{opacity:.11;transform:scale(.9)}50%{opacity:.2;transform:scale(1.06)}}
/* Once the cards are out, everything that is not a card gets out of the way:
   the set picker was clashing with the RARE / EPIC / LEGENDARY banner and
   stealing attention from the one thing on screen that matters. */
.setpick.hushed{opacity:.13;pointer-events:none;transition:opacity .45s var(--ease)}
.setpick{transition:opacity .45s var(--ease)}
.slot{position:absolute;transition:transform .5s var(--ease),opacity .4s;will-change:transform;
  transform:translate3d(var(--sx,0px),var(--sy,0px),0) rotate(var(--sr,0deg)) scale(var(--ss,1))}
/* Exit is deliberately faster than entry (~60%): a card that has been seen
   should get out of the way immediately, or the pace dies. */
.slot.gone{pointer-events:none;visibility:hidden;
  transition:transform .34s var(--ease),opacity .26s,visibility 0s .36s}
/* A card that has gone still has to stay in the DOM — the transition is what
   flicks it away — but it must stop costing anything, and this turned out to
   be worth more than any single reveal effect: five revealed cards were
   leaving five aura pulses and two holo sheens ticking on every frame for the
   whole rest of the sequence. The visibility above flips discretely once the
   flick has landed, so there is no timer and no JS to get wrong. */
.slot.gone .aura,.slot.gone .shinewrap i,
.slot.gone .card.holo .in::after{animation:none!important;opacity:0!important}
/* .lift exists so the wind-up (a hover before the turn) has somewhere to live
   that is not .slot's var-driven transform and not .flipper's flip. It also
   finally gives the flip a real perspective — .stage's own perspective only
   ever reached .fan, so until now the card rotated orthographically. */
.lift{position:relative;perspective:1000px}
.slot.windup .lift{animation:windUp var(--wd,.5s) var(--ease) both}
@keyframes windUp{0%{transform:translate3d(0,0,0) scale(1)}
  60%{transform:translate3d(0,-12px,0) scale(1.055)}
  100%{transform:translate3d(0,-5px,0) scale(1.025)}}
.flipper{position:relative;width:min(182px,49vw);aspect-ratio:59/86;transform-style:preserve-3d;
  transition:transform var(--flipd,.62s) var(--ease)}
.slot.flipped .flipper{transform:rotateY(180deg)}
.flipper>*{position:absolute;inset:0;backface-visibility:hidden}
.flipper .fr{transform:rotateY(180deg)}
.flipper .card{--cw:min(182px,49vw);width:100%}

/* THE STRIPES, part two — the light sweep raking across the card face itself.
   Cannot live inside .card (its .in clips, and the NEW/DUPLICATE banner has to
   stand proud of the frame), so it gets its own clipped overlay above the card
   and below the banner. One <i> per stripe, 1 for a common up to 3 for a
   legendary, each a gradient sliding on translate3d. */
.shinewrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5;
  border-radius:calc(min(182px,49vw)*.062)}
.shinewrap i{position:absolute;top:-55%;bottom:-55%;left:0;width:34%;opacity:0;
  transform:translate3d(-280%,0,0) rotate(17deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05) 20%,
    rgba(255,255,255,.5) 44%,#fff 50%,rgba(255,255,255,.5) 56%,
    rgba(255,255,255,.05) 80%,transparent)}
/* the trailing stripes carry the rarity colour, so an epic rakes violet and a
   legendary rakes gold — the tier is readable from the sweep alone */
.shinewrap i.tint{background:linear-gradient(90deg,transparent,
  color-mix(in srgb,var(--fxc,#FFD24A) 30%,transparent) 26%,
  var(--fxc,#FFD24A) 48%,#fff 50%,var(--fxc,#FFD24A) 52%,
  color-mix(in srgb,var(--fxc,#FFD24A) 30%,transparent) 74%,transparent)}
.shinewrap i.go{animation:rake var(--shd,.8s) var(--ease) var(--shdel,0s) forwards}
@keyframes rake{0%{opacity:0;transform:translate3d(-280%,0,0) rotate(17deg)}
  10%{opacity:1}86%{opacity:1}
  100%{opacity:0;transform:translate3d(440%,0,0) rotate(17deg)}}

.slot .tapme{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);font-weight:800;transition:opacity .3s}
.slot.flipped .tapme{opacity:0}
.aura{position:absolute;inset:-16%;border-radius:26px;pointer-events:none;opacity:0;z-index:-1}
.slot.flipped.rari .aura{opacity:1;background:radial-gradient(circle,rgba(60,150,255,.55),transparent 68%);
  animation:auraP 1.6s ease-in-out infinite}
.slot.flipped.epiku .aura{opacity:1;background:radial-gradient(circle,rgba(170,70,255,.6),transparent 68%);
  animation:auraP 1.3s ease-in-out infinite}
.slot.flipped.leggendarju .aura{opacity:1;background:radial-gradient(circle,rgba(255,200,70,.85),transparent 70%);
  animation:auraP 1s ease-in-out infinite}
@keyframes auraP{0%,100%{transform:scale(.94);opacity:.55}50%{transform:scale(1.08);opacity:1}}
.pt{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;z-index:6;
  background:radial-gradient(circle,#fff 0 18%,var(--pc,#fff) 34%,transparent 70%);
  animation:ptFly var(--pd,.95s) var(--ease) forwards}
@keyframes ptFly{0%{transform:translate3d(0,0,0) scale(0);opacity:1}
  25%{opacity:1;transform:translate3d(calc(var(--tx)*.35),calc(var(--ty)*.35),0) scale(1.2)}
  100%{transform:translate3d(var(--tx),var(--ty),0) scale(0);opacity:0}}
.rlabel{position:absolute;top:9%;left:0;right:0;text-align:center;font-family:var(--disp);font-weight:900;
  font-size:clamp(19px,6.5vw,28px);letter-spacing:.18em;text-transform:uppercase;pointer-events:none;z-index:41;
  opacity:0;text-shadow:0 0 24px currentColor,0 3px 0 rgba(0,0,0,.6)}
.rlabel.go{animation:rl 1.6s var(--ease) forwards}
@keyframes rl{0%{opacity:0;transform:scale(1.7)}18%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
/* The impact shake is on the STAGE, never on #app. Two reasons, and both of
   them matter: #app is an ancestor of the fixed tab bar, and a transform on it
   makes it the bar's containing block — that is the bug that dragged the bar
   off the bottom of the screen once already. It is also the most expensive
   thing on the screen, because it promotes and repaints the whole application
   layer for half a second. The stage is most of what you are looking at
   anyway, so the effect is the same and neither problem exists. */
body.shake .stage,body.shake .ub-stage{animation:scShake .5s var(--ease)}
@keyframes scShake{0%,100%{transform:translate3d(0,0,0)}
  12%{transform:translate3d(-9px,5px,0)}28%{transform:translate3d(8px,-6px,0)}
  46%{transform:translate3d(-7px,-4px,0)}64%{transform:translate3d(6px,5px,0)}82%{transform:translate3d(-3px,-2px,0)}}
.packbar{flex:0 0 auto;width:100%;max-width:460px;display:grid;gap:9px;padding-top:8px}
/* the counter that runs alongside the reveal — "2 of 5" — so the sequence has
   a visible end and the Skip button never feels like the only way out */
.packbar .revrow{display:flex;align-items:center;gap:10px}
.packbar .revrow .hint{flex:1;text-align:left}
.packbar .revrow .btn{flex:0 0 auto;min-height:44px;padding:0 16px}
.pcounter{font-family:var(--disp);font-weight:900;font-size:12px;letter-spacing:.12em;
  color:var(--gold);font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ══════════════════ WHAT YOU ACTUALLY GOT ══════════════════
   A list, not a row of pills: every card by name, by rarity, with its own
   verdict (NEW / DUPLICATE), each row a 52px tap target that opens the card. */
.sumwrap{place-self:stretch;display:flex;flex-direction:column;min-height:0;
  width:100%;max-width:440px;margin:0 auto;padding:4px 0 0;gap:11px;
  /* safe centre: five rows sit in the middle of the stage, but a set with more
     to say still scrolls from the top instead of losing its head */
  justify-content:safe center}
.sumhead{text-align:center;flex:0 0 auto}
.sumhead h2{font-size:clamp(18px,5.6vw,23px);letter-spacing:.06em}
.sumsub{margin:5px 0 0;font-size:12px;color:var(--dim);display:flex;gap:8px;
  justify-content:center;flex-wrap:wrap;align-items:center}
.sumsub b{display:inline-flex;align-items:center;gap:3px;font-weight:800}
.sumlist{display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:0;
  flex:0 1 auto;padding:1px 2px 4px;-webkit-overflow-scrolling:touch}
.sumrow{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;
  padding:7px 11px 7px 8px;border-radius:13px;text-align:left;
  background:linear-gradient(100deg,color-mix(in srgb,var(--rc,#888) 17%,var(--panel)),var(--panel) 62%);
  border:1px solid color-mix(in srgb,var(--rc,#888) 38%,var(--line));
  transition:transform .15s var(--ease);
  animation:sumIn .34s var(--ease) both;animation-delay:var(--sd,0s)}
@keyframes sumIn{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
.sumrow:active{transform:scale(.975)}
.sumrow .rgem{flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;
  color:var(--rc,#888);background:rgba(0,0,0,.32);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc,#888) 45%,transparent)}
.sumrow .rgem .ico{width:19px;height:19px}
.sumrow .scol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.sumrow .snm{font-family:var(--disp);font-weight:900;font-size:13px;letter-spacing:.02em;
  color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumrow .smeta{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The rarity word is lifted towards white rather than printed in the raw
   rarity colour: Rare's blue is only about 4:1 on this panel and this is 10px
   type. The hue still reads, and the gem and the row tint say it again, so the
   tier is never carried by colour alone. */
.sumrow .smeta .r{color:color-mix(in srgb,var(--rc,#888) 66%,#FFFFFF)}
.stag{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;height:25px;padding:0 9px;
  border-radius:999px;font-family:var(--disp);font-weight:900;font-size:9.5px;letter-spacing:.13em}
.stag.new{background:linear-gradient(180deg,#8CFFC0,var(--ok));color:#04240F;
  box-shadow:0 2px 8px rgba(61,220,132,.4)}
.stag.dupe{background:linear-gradient(180deg,#DAD2F2,#9C8FC6);color:#1A1230;
  box-shadow:0 2px 8px rgba(120,104,170,.35)}
.stag .ico{width:13px;height:13px}
.stag .dust{color:#5A3B00}

/* ══════════════════ COLLECTION ══════════════════ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px 9px;padding:4px 0 26px}
.gcell{position:relative;display:flex;justify-content:center}

/* ══════════════════ DECK BUILDER ══════════════════ */
.segwrap{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px;
  margin-bottom:8px;flex:0 0 auto}
.segwrap button{flex:1;min-height:42px;border-radius:10px;font-family:var(--disp);font-weight:900;font-size:12px;
  letter-spacing:.08em;color:var(--dim);transition:.15s var(--ease)}
.segwrap button.on{background:var(--gold);color:#241800}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
.dbrow{display:flex;align-items:center;gap:10px;padding:7px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);margin-bottom:7px}
.dbrow .card{--cw:46px}
.dbrow .info{flex:1;min-width:0}
.dbrow .info .n{font-family:var(--disp);font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.dbrow .info .m{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbrow .info .e2{font-size:10.5px;color:#7EE0A0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.qty button{width:40px;height:40px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  font-family:var(--disp);font-weight:900;font-size:17px;display:grid;place-items:center}
.qty button:active{transform:scale(.9)}
.qty button[disabled]{opacity:.3}
.qty .v{min-width:24px;text-align:center;font-family:var(--disp);font-weight:900;font-size:15px}
.dhead{font-family:var(--disp);font-weight:900;font-size:11px;letter-spacing:.16em;color:var(--dim);
  margin:12px 0 6px;display:flex;justify-content:space-between;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:2px 0 8px;flex:0 0 auto}
.bar>i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);
  background:linear-gradient(90deg,var(--hot),var(--gold));transition:transform .3s var(--ease)}
.stats{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;flex:0 0 auto}
.savebar{flex:0 0 auto;display:flex;gap:9px;padding-top:8px;align-items:center}

/* ══════════════════ DUEL ══════════════════ */
#scr-duel{padding:calc(var(--sat) + 4px) 6px calc(var(--sab) + 4px)}
/* 5 monster + 5 spell/trap zones a side. --fw is sized so five cards plus their
   gaps always fit the viewport width — never let this go back to a fixed px. */
.duel{display:flex;flex-direction:column;flex:1;min-height:0;gap:3px;--fw:min(78px,calc((100vw - 42px)/5))}
.pinfo{display:flex;align-items:center;gap:7px;flex:0 0 auto;padding:2px 4px}
.pinfo .who{font-family:var(--disp);font-weight:900;font-size:10px;letter-spacing:.08em;color:var(--dim);
  white-space:nowrap;max-width:82px;overflow:hidden;text-overflow:ellipsis}
.lp{font-family:var(--disp);font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;line-height:1}
.lp.hit{animation:lpHit .5s var(--ease)}
@keyframes lpHit{0%{transform:scale(1)}30%{transform:scale(1.28);color:var(--bad)}100%{transform:scale(1)}}
.lp.up{animation:lpUp .5s var(--ease)}
@keyframes lpUp{0%{transform:scale(1)}30%{transform:scale(1.2);color:var(--ok)}100%{transform:scale(1)}}
.lpbar{flex:1;height:9px;border-radius:99px;background:#2A1F42;overflow:hidden;border:1px solid var(--line)}
.lpbar>i{display:block;height:100%;width:100%;transform-origin:left;transition:transform .5s var(--ease);
  background:linear-gradient(90deg,#3DDC84,#FFC542 62%,#E8452C)}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:10px;
  font-family:var(--disp);font-weight:900;display:flex;align-items:center;gap:3px;white-space:nowrap}
.zrow{display:flex;justify-content:center;gap:5px;flex:0 0 auto}
/* the empty-slot look has to read on any playmat, including a bright green one */
.zone{width:var(--fw);aspect-ratio:59/86;border-radius:7px;border:1.5px dashed rgba(255,255,255,.28);
  background:rgba(10,6,20,.34);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
  display:grid;place-items:center;position:relative;transition:border-color .18s,background .18s}
.zone .card{--cw:var(--fw);width:100%;height:100%}
.zrow.st .zone{width:calc(var(--fw)*.74);border-style:dotted;border-color:rgba(194,24,91,.42)}
.zrow.st .zone .card{--cw:calc(var(--fw)*.74)}
.zone.legal{border-color:var(--ok);background:rgba(61,220,132,.12);animation:legalP 1.1s ease-in-out infinite;cursor:pointer}
@keyframes legalP{0%,100%{box-shadow:0 0 0 0 rgba(61,220,132,.35)}50%{box-shadow:0 0 0 7px rgba(61,220,132,0)}}
.zone.target{border-color:var(--bad);background:rgba(255,84,104,.14);animation:legalP 1.1s ease-in-out infinite;cursor:pointer}
.zone.sel{border-color:var(--gold);background:rgba(255,197,66,.16)}
.zone .card.def{transform:rotate(90deg) scale(.72)}
.zone .card.tired{filter:brightness(.6) saturate(.65)}
.zone .fxb{position:absolute;top:-6px;left:-4px;font-size:11px;z-index:6;filter:drop-shadow(0 1px 2px #000)}
.zone .atkv{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:#0B0812;
  border:1px solid var(--hot);color:#fff;font-family:var(--disp);font-weight:900;font-size:9.5px;
  padding:1px 5px;border-radius:99px;z-index:6;white-space:nowrap}
/* takes the slack so the two boards sit apart instead of leaving a dead band
   under the action bar on a tall phone */
.mid{flex:1 1 auto;display:flex;align-items:center;gap:6px;padding:3px 2px;min-height:40px}
.phase{font-family:var(--disp);font-weight:900;font-size:9.5px;letter-spacing:.08em;padding:5px 8px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.phase.you{background:var(--gold);color:#241800;border-color:#FFE9B0}
.phase.ai{background:var(--hot);color:#fff;border-color:#FF9C88}
.ticker{flex:1;min-width:0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hand{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 2px 10px;scrollbar-width:none;
  min-height:118px;align-items:flex-end}
.hand::-webkit-scrollbar{display:none}
.hand .h{position:relative;flex:0 0 auto}
.hand .card{--cw:74px;transition:transform .2s var(--ease)}
.hand .h.sel .card{transform:translate3d(0,-13px,0) scale(1.06);box-shadow:0 0 0 2px var(--gold),0 8px 20px rgba(0,0,0,.6)}
.hand .h.no .card{filter:brightness(.5) saturate(.5)}
.actbar{flex:0 0 auto;display:flex;gap:7px;padding-top:2px}
.actbar .btn{min-height:48px;font-size:11.5px;flex:1;letter-spacing:.04em}
/* ── THE DUEL, SIDEWAYS ──────────────────────────────────────────────
   The manifest used to say "orientation":"portrait", which on Android is
   not a hint but a LOCK: an installed PWA simply would not rotate, so
   this case could not happen and was never designed. It says "any" now
   (tombla is meant to be played with the phone turned sideways), and the
   duel was the one screen that did not survive the change.

   Why it did not: this column is nine fixed-height bands — two player
   strips, four zone rows, the ticker, the hand and the action bar — and
   --fw, the width of a card, was bounded by the viewport WIDTH only. Turn
   the phone and the width goes UP, so --fw stayed at its 78px maximum and
   the column needed ~630px of height inside 360. The shell is
   overflow:hidden and must never scroll, so the overflow was not a
   scrollbar: the player's own monster row, spell row, hand and action bar
   were simply not on the screen. Measured at 800x360, 854x384, 894x440
   and 915x412 — every landscape phone size, i.e. all of them.

   So --fw takes a THIRD bound, the height: whatever is left once the
   bands that cannot shrink have had their share, divided by the 5.08
   card-heights the four rows come to (two full rows plus two at .74,
   each 86/59 tall). Everything else steps down with it. The board gets
   small — a duel is a portrait game and this is the graceful version of
   sideways, not the good one — but every zone, every card in hand and
   every button is ON the screen and tappable, which is the whole of the
   difference. Nothing here applies in portrait: the query needs BOTH a
   short viewport and landscape, so his 440x894 phone never sees it. */
@media (orientation:landscape) and (max-height:560px){
  #scr-duel{padding:calc(var(--sat) + 2px) calc(var(--sar) + 6px)
            calc(var(--sab) + 2px) calc(var(--sal) + 6px)}
  .duel{gap:2px;
    /* 150px is what the bands that do NOT scale with a card come to — the
       two player strips, the ticker, the action bar, the gaps and the
       padding. 6.8 is what one card-width costs in height: 5.08 of it in
       the four zone rows, 1.68 more in the hand, whose cards are sized off
       --fw here too so the whole column shrinks together. Solved rather
       than guessed, and checked at 360, 384, 412 and 440 tall. */
    --fw:min(78px, calc((100vw - 42px)/5), calc((100dvh - 150px)/6.8))}
  .pinfo{padding:0 4px;gap:5px}
  .lp{font-size:15px}
  .lpbar{height:7px}
  .badge{padding:2px 5px;font-size:9px}
  .mid{min-height:26px;padding:1px 2px}
  .hand{min-height:0;padding:4px 2px 5px}
  .hand .card{--cw:calc(var(--fw)*1.15)}
  .actbar{padding-top:0}
  .actbar .btn{min-height:40px;font-size:11px}
}
/* visibility matters, and it is NOT just tidiness. The closed sheet "hides" by
   translating 110% below the viewport — but in the installed app the page is
   62px TALLER than the viewport (see #app), so "just below the viewport" is
   real, visible screen: the parked sheet's rounded top edge sat exactly over
   the tab bar's label row, which is why the installed app showed four icons,
   no labels, and a slab of dead purple under them. visibility:hidden makes the
   closed sheet actually invisible wherever it is parked. The transition pair
   keeps the animation: closing slides for .28s THEN hides (visibility flips
   discretely at the end); opening unhides instantly (0s 0s) and slides up. */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:200;background:linear-gradient(180deg,#241A3E,#150F22);
  border-top:1px solid var(--line2);border-radius:20px 20px 0 0;padding:14px 14px calc(var(--sab) + 14px);
  transform:translate3d(0,110%,0);box-shadow:0 -14px 40px rgba(0,0,0,.6);
  visibility:hidden;transition:transform .28s var(--ease),visibility 0s .28s;
  max-height:78vh;overflow-y:auto}
.sheet.on{transform:none;visibility:visible;transition:transform .28s var(--ease),visibility 0s 0s}
.sheet h3{font-size:15px;margin-bottom:3px}
.sheet .opts{display:grid;gap:8px;margin-top:12px}
.scrim{position:fixed;inset:0;background:rgba(4,2,10,.66);z-index:150;opacity:0;pointer-events:none;
  transition:opacity .25s;backdrop-filter:blur(3px)}
.scrim.on{opacity:1;pointer-events:auto}
.flash{position:fixed;left:0;right:0;top:36%;z-index:400;text-align:center;pointer-events:none;
  font-family:var(--disp);font-weight:900;font-size:clamp(18px,6vw,29px);letter-spacing:.06em;
  text-transform:uppercase;opacity:0;padding:0 16px;text-shadow:0 0 26px currentColor,0 4px 0 rgba(0,0,0,.65)}
.flash.go{animation:fl 1.3s var(--ease) forwards}
@keyframes fl{0%{opacity:0;transform:scale(1.5)}16%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.dmg{position:fixed;z-index:410;font-family:var(--disp);font-weight:900;font-size:25px;pointer-events:none;
  text-shadow:0 2px 8px #000;animation:dmgUp 1s var(--ease) forwards}
@keyframes dmgUp{0%{opacity:0;transform:translate3d(-50%,0,0) scale(.6)}
  20%{opacity:1;transform:translate3d(-50%,-14px,0) scale(1.15)}
  100%{opacity:0;transform:translate3d(-50%,-64px,0) scale(1)}}
.slash{position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:7px;overflow:hidden;
  background:linear-gradient(58deg,transparent 42%,#fff 49%,#FFC542 51%,transparent 58%);
  opacity:0;animation:slashGo .45s var(--ease) forwards}
@keyframes slashGo{0%{opacity:0;transform:translate3d(-70%,70%,0)}30%{opacity:1}100%{opacity:0;transform:translate3d(70%,-70%,0)}}

/* ══════════════════ MODAL / TOAST ══════════════════ */
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(4,2,10,.7);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.mbox{background:linear-gradient(180deg,#241A3E,#150F22);border:1px solid var(--line2);border-radius:20px;
  padding:16px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;
  animation:mIn .28s var(--ease) both;box-shadow:0 30px 70px rgba(0,0,0,.7)}
@keyframes mIn{from{opacity:0;transform:scale(.9) translate3d(0,16px,0)}to{opacity:1;transform:none}}
.cardview{display:flex;flex-direction:column;align-items:center;gap:11px}
.cardview .joke{font-size:13.5px;color:#D9CFF2;text-align:center;font-style:italic;line-height:1.5;margin:0}
.cardview .effect{font-size:13px;color:#7EE0A0;text-align:center;line-height:1.45;margin:9px 0 0;
  border-top:1px dashed rgba(255,255,255,.16);padding-top:9px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 120px);transform:translate3d(-50%,0,0);z-index:500;
  background:#2A1F42;border:1px solid var(--line2);border-radius:12px;padding:11px 17px;font-size:13.5px;
  font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{animation:tst 2.5s var(--ease) forwards}
@keyframes tst{0%{opacity:0;transform:translate3d(-50%,14px,0)}12%{opacity:1;transform:translate3d(-50%,0,0)}
  84%{opacity:1}100%{opacity:0;transform:translate3d(-50%,-8px,0)}}
/* Same standalone geometry as #app: position:fixed pins to the SHORT viewport,
   which in the installed app ends 62px (env(safe-area-inset-top)) above the
   physical bottom of the screen. An OPEN sheet, a modal backdrop or the scrim
   would therefore stop 62px short, with the tab bar showing through the bare
   strip underneath. Pulling their bottom edge down by the same inset lands
   them on the true bottom, exactly like the shell. Browser tabs are untouched
   — there the viewport bottom IS the bottom. */
.result{text-align:center;display:grid;gap:12px;place-items:center}
.result .big{font-family:var(--disp);font-weight:900;font-size:clamp(36px,12vw,56px);letter-spacing:.08em;line-height:1}
.result .big.win{background:linear-gradient(180deg,#FFF3CF,var(--gold),#C77A00);-webkit-background-clip:text;
  background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6E3B00)}
.result .big.lose{color:var(--bad);filter:drop-shadow(0 3px 0 #5A0812)}
.result p{margin:0}
.logline{font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);color:#CFC4E8}

@media (min-width:760px){
  .screen{padding-left:max(24px,calc((100vw - 720px)/2));padding-right:max(24px,calc((100vw - 720px)/2))}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .card.sm{--cw:112px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
body.reduced .foil,body.reduced .card.holo .in::after,body.reduced .aura{animation:none!important}
body.reduced .pt,body.reduced .rays,body.reduced .burst{display:none!important}
/* Reduced motion gets the calm path: the whole reveal FX layer and the light
   sweeps are removed outright (JS also cuts straight to the summary, so nobody
   loses sight of what they pulled), and the summary rows arrive without the
   travel. Kept as display:none rather than animation:none so the compositor is
   never handed the layers at all. */
body.reduced .fxback,body.reduced .fxtop,body.reduced .shinewrap,
body.reduced .pack .seam{display:none!important}
body.reduced .sumrow,body.reduced .dupebadge,body.reduced .newbadge,
body.reduced .pack.charge{animation:none!important}
body.reduced .slot.windup .lift{animation:none!important}
body.reduced .fan::before{animation:none!important;opacity:.12}
body.reduced .hint{animation:none!important;opacity:.8}

/* ── PARTY BUTTON, drawn to the eye ────────────────────────────────────
   The party hub sits last in the Home scroll, so it is easy to miss. A
   slow gold breath — a warm glow that swells and eases, with a faint
   lift — makes it the one thing on the page that moves, without shouting.
   Scoped entirely to #btn-party so nothing else is touched. The button
   keeps a soft gold rim at rest so it never looks broken when the motion
   is off. position:relative + the ::before sheen ride on top of the
   ghost background; overflow:hidden keeps the sweep inside the pill. */
#btn-party{position:relative;overflow:hidden;
  border-color:color-mix(in srgb,var(--kx-accent) 38%,transparent);
  animation:partyBreath 3.2s var(--ease,ease-in-out) infinite}
#btn-party>*{position:relative;z-index:1}
#btn-party::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,color-mix(in srgb,var(--kx-accent) 26%,transparent) 48%,
    color-mix(in srgb,var(--kx-accent) 32%,transparent) 52%,transparent 70%);

#btn-party .ico{color:var(--gold)}
@keyframes partyBreath{

    border-color:color-mix(in srgb,var(--kx-accent) 34%,transparent);transform:translateZ(0)}
  50%{box-shadow:0 6px 0 -2px rgba(0,0,0,.5),0 0 26px 3px color-mix(in srgb,var(--kx-accent) 42%,transparent);
    border-color:color-mix(in srgb,var(--kx-accent) 72%,transparent);transform:translate3d(0,-2px,0)}

  0%,62%,100%{transform:translateX(-120%)}

}
/* MOTION-GATED: honour the OS setting AND the app's own reduced class. The
   button falls back to a calm, steady gold rim — visible, but still. */
@media (prefers-reduced-motion:reduce){
  #btn-party,#btn-party::before{animation:none!important}
  #btn-party::before{display:none}

    box-shadow:0 0 16px 1px rgba(255,197,66,.24)}

<script>
(function(){
  var sp=document.getElementById('kl-splash'), bar=document.getElementById('kl-bar'), art=document.getElementById('kl-art'), tip=document.getElementById('kl-tip');
  if(!sp) return;
  try{ var im=new Image(); im.onload=function(){ if(art){ art.style.backgroundImage="url('art/ui/loading-bg.webp')"; art.style.opacity=".92"; } }; im.src="art/ui/loading-bg.webp"; }catch(e){}
  var tips=['SHUFFLING THE DECK…','DEALING A ROUGH HAND…','LIGHTING THE FESTA…','WARMING UP THE VILLAGE…'], ti=0;
  var pct=6, t=setInterval(function(){ pct+=Math.max(1,(90-pct)*0.09); if(pct>92)pct=92; if(bar)bar.style.width=pct.toFixed(0)+'%'; if(tip&&Math.random()<0.18){ ti=(ti+1)%tips.length; tip.textContent=tips[ti]; } },170);
  var gone=false, t0=Date.now();
  /* MINIMUM SHOWTIME. Boot got fast enough (parallel module fetch, warm cache) that the
     splash was gone before the deal even finished — a title card nobody sees. Hold it long
     enough for the sequence to land: cards fan out by ~.95s, the logo pops and takes its
     first shine at ~1.1s. 1900ms covers that and still feels instant, not a wait. */
  var MIN_MS = 1900;
  function drop(){ if(gone)return; gone=true; clearInterval(t); if(bar)bar.style.width='100%';
    if(tip)tip.textContent='READY';
    setTimeout(function(){ sp.style.opacity='0'; setTimeout(function(){ try{sp.remove();}catch(e){} },620); },170); }
  function fin(){ if(gone)return; var left=MIN_MS-(Date.now()-t0); if(left>0){ setTimeout(drop,left); return; } drop(); }
  /* HOLD until the WHOLE game is loaded — every module registered (KARTI_LOADED /
     karti:loaded), NOT just when Home paints — so a game can never be tapped before
     its module has landed. This is the one screen that must not lie about being ready. */
  if(window.KARTI_LOADED) fin(); else addEventListener('karti:loaded', fin, {once:true});
  setTimeout(drop, 20000);   /* safety only: never strand the app forever behind the splash */
})();
</script>

<!-- ═══ ICON SPRITE ═══

     truth — keep the two identical). Inline rather than fetched so the icons

<!-- ═══════════════════════════════════════════════════════════════════
     KARTI icon set — drawn by hand on a 24x24 grid, 2px round strokes,
     one weight across the whole set, legible down to 14px on a dark
     background. Single colour: everything is currentColor, so the
     faction colours / gold / rarity colours drive them from CSS.
     No emoji, no icon font, no network — <use href="#i-NAME"> only.
     Stroke + fill live on each <symbol> as PRESENTATION ATTRIBUTES on
     purpose: a CSS rule on .ico would otherwise beat any per-path
     override and flatten every solid shape.
     This file is the source of truth; the identical markup is inlined
     once into index.html, between the SPRITE marker comments.
     ═══════════════════════════════════════════════════════════════════ -->

<!-- CITY (belt) — bastion wall, three merlons and an arched gate. -->

<div id="app">

  <!-- ═══ AUTH — the entry gate. Same festa scene as the splash: painted
       backdrop + vignette on the section, embers rising through it, a fanned
       hand behind the split gold/crimson wordmark, the actions on glass. -->
  <section class="screen" id="scr-auth">
    <div class="kx-embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="scroll">
      <div class="authwrap">
        <div>
          <div class="kx-fan" aria-hidden="true"><b class="f1"></b><b class="f2"></b><b class="f3"></b><b class="f4"></b><b class="f5"></b></div>
          <h1 class="logo kx-split"><span class="lg1">KAR</span><span class="lg2">TI</span><i class="lg-shine" aria-hidden="true"></i></h1>
          <p class="tagline">Malta's rudest card duel</p>
        </div>
        <div id="auth-body"></div>
      </div>
    </div>
  </section>

  <!-- ═══ HOME ═══
       Full-bleed: this screen fills the viewport and never scrolls. Three
       bands — a thin profile bar, a centred middle that owns all the slack,
       and the secondary nav pinned to the bottom above the home bar. -->
  <section class="screen home" id="scr-home">
    <!-- the same rising embers as the splash and the gate — the atmosphere layer.
         Sits FIRST so every real control paints over it; pointer-events:none. -->
    <div class="kx-embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <!-- TOP BAR: profile on the LEFT, currency (coins + dust) on the RIGHT — the
         two are balanced against each other so the eye reads "who you are" on one
         side and "what you have" on the other. The cards indicator is NOT here: it
         is a tappable chip below the wallet that routes to the Collection. -->
    <div class="homehead">
      <!-- LEFT: the profile chip, and DIRECTLY UNDER IT the compact daily-spin
           badge. The badge only exists in the DOM when a free spin is waiting
           (renderHome adds/removes it) — when today's spin is already claimed it
           is not rendered at all, which keeps the top-left clean and the home
           column shorter. -->
      <div class="headleft">
        <button class="pchip" id="profile-chip" aria-label="Profile options"></button>
        <!-- #spin-slot is filled by renderHome(): a small "spin available"
             pill when ready, emptied when claimed. -->
        <div id="spin-slot" class="spin-slot"></div>
      </div>
      <div class="wallet" id="wallet" aria-label="Your currency"></div>
    </div>

    <div class="homemid">
      <div class="brand">
        <h1 class="logo kx-split"><span class="lg1">KAR</span><span class="lg2">TI</span><i class="lg-shine" aria-hidden="true"></i></h1>
        <p class="tagline">Malta's rudest card duel</p>
      </div>

<script>
/* ── icons ──────────────────────────────────────────────────────────
   ICO(name)                → decorative mark, hidden from screen readers
   ICO(name, 'Coins')       → the icon IS the label (role=img + aria-label)
   ILB(name, 'Log in')      → icon + words inside a .btn (which is a column
                              flexbox, so the pair must be wrapped)
   Defined here, before the loader below, so every game script can use it. */
window.ICO = function(name, label, cls){
  return '<svg class="ico' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" ' +
    (label ? 'role="img" aria-label="' + String(label).replace(/[&<>"]/g, function(c){
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }) + '"'
           : 'aria-hidden="true"') +
    ' focusable="false"><use href="#i-' + name + '"></use></svg>';
};
window.ILB = function(name, html, cls){
  return '<span class="bl">' + window.ICO(name, null, cls) + '<span>' + html + '</span></span>';
};

/* ── KARTI_THEME — the ONE documented door a cosmetic theme walks through ──
   The gate, Home and the tab bar are painted entirely off the --kx-* custom
   properties documented in the THEME TOKENS block at the top of this file.
   Phase 2 (cosmetic themes) calls:

     KARTI_THEME.apply({ accent:'#59D2FF', bg:'#06121C', homeBg:'art/th/sea.jpg', … })
       — any subset of the keys below; unknown keys are ignored, image keys
         (homeBg/gateBg) accept a bare path/URL or a full `url(...)`, and
         every value lands as an inline --kx-* property on <html>, which
         outranks the stylesheet defaults.
     KARTI_THEME.reset()
       — removes every inline --kx-* override; the stylesheet defaults (the
         stock crimson/gold KARTI identity) take over again, untouched.
     KARTI_THEME.vars
       — the key → custom-property map, so a theme editor can enumerate it.

   Defined here, before the loader, so it exists whenever any module — or the
   console — wants it. It never persists anything itself: storage and "which
   theme is equipped" are the caller's business.                              */
window.KARTI_THEME = (function(){
  var MAP = {
    accent:'--kx-accent',       accentInk:'--kx-accent-ink',
    accent2:'--kx-accent-2',    accent2Deep:'--kx-accent-2-deep',
    bg:'--kx-bg',               bg2:'--kx-bg-2',
    surface:'--kx-surface',     ink:'--kx-ink',
    dim:'--kx-dim',
    tabBg:'--kx-tab-bg',        tabOn:'--kx-tab-on',
    tabTint:'--kx-tab-tint',    tabAlpha:'--kx-tab-alpha',
    tabInk:'--kx-tab-ink',
    glow:'--kx-glow',           ember:'--kx-ember',
    homeBg:'--kx-home-bg',      gateBg:'--kx-gate-bg',
    appBg:'--kx-app-bg'
  };
  var IMG = { homeBg:1, gateBg:1, appBg:1 };
  var root = document.documentElement;
  function apply(theme){
    if (!theme) return;
    for (var k in MAP){
      if (!Object.prototype.hasOwnProperty.call(theme, k)) continue;
      var v = theme[k];
      if (v == null || v === ''){ root.style.removeProperty(MAP[k]); continue; }
      v = String(v);
      if (IMG[k] && v !== 'none' && v.indexOf('url(') !== 0 && v.indexOf('gradient') < 0)
        v = 'url("' + v.replace(/"/g, '%22') + '")';
      root.style.setProperty(MAP[k], v);
    }
  }
  function reset(){
    for (var k in MAP) root.style.removeProperty(MAP[k]);
  }
  return { apply: apply, reset: reset, vars: MAP };
})();

/* ── which build is this phone REALLY running ─────────────────────────────
   BUILD is baked into index.html, and the shell CSS is inline in this SAME
   file — so "v22" here is the truth about the layout on screen; it cannot say
   new while rendering old. What it cannot tell you is which WORKER is serving
   the files: for that, swVersion() asks the live controlling service worker
   over a MessageChannel, and the answer comes from the script iOS actually
   activated — not from the server, not from a constant. Keep BUILD in step
   with CACHE in sw.js (bump both on every deploy). */
var KARTI_BUILD = 357;
window.KARTI_BUILD = KARTI_BUILD;
window.swVersion = function(){
  return new Promise(function(resolve){
    var ctl = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!ctl) return resolve(null);
    var mc = new MessageChannel();
    var t = setTimeout(function(){ resolve(null); }, 1500);
    mc.port1.onmessage = function(e){
      clearTimeout(t);
      resolve(e.data && e.data.cache ? String(e.data.cache) : null);
    };
    try { ctl.postMessage({ type: 'VERSION' }, [mc.port2]); }
    catch (err){ clearTimeout(t); resolve(null); }
  });
};

     source order (the spec for ordered dynamic scripts), so every dependency
     holds while the network does the fetches concurrently. A missing optional
     file (404) just fires onerror and counts as done, so it can never stop the
     game booting.
     Wave 1 is the shell — Home paints the moment game.js executes. Wave 2 (the
     game modules) is only appended after wave 1 has fully executed (a classic
     script's load event fires AFTER it runs) plus one frame, so Home's paint is
     never contending with forty game UIs for the pipe. Cross-wave order is
     therefore also guaranteed: nothing in `defer` can run before all of `files`.
     KARTI_LOADED + karti:loaded — the readiness signal party.js gates entry
     on — fires only when BOTH waves are done. */
  (function loadAll(){
    function loadWave(list, then){
      var n = list.length, done = 0;
      if (!n){ then(); return; }
      function tick(){ if (++done >= n) then(); }
      for (var i = 0; i < n; i++){
        var s = document.createElement('script');
        s.src = list[i]; s.async = false;   /* ordered execution, parallel fetch */
        s.onload = s.onerror = tick;
        document.head.appendChild(s);
      }
    }
    function finish(){
      window.KARTI_LOADED = true;
      try { dispatchEvent(new Event('karti:loaded')); } catch (e){}
    }
    loadWave(files, function(){
      /* wave 1 has run — let the first Home frame land, then bring in the games */
      var go = function(){ loadWave(defer, finish); };
      if (window.requestAnimationFrame) requestAnimationFrame(function(){ setTimeout(go, 0); });
      else setTimeout(go, 0);
    });
  })();

  /* ── THE ESCAPE HATCH ──────────────────────────────────────────────────
     A service worker that caches this hard can strand the app: if an update
     lands badly — a bad network on the one request that mattered, an install
     that half-finished, a worker claiming a page that had already loaded the
     previous shell — you get a black screen and NO WAY BACK, because the
     thing that would fix it is the thing that will not start. The cache has
     been bumped more than thirty times in a day; that is not a hypothetical.
     So: if the app has not come up after eight seconds, say so and offer the
     one action that always works — throw every cache away, unregister the
     worker, and fetch a clean copy. It is deliberately plain HTML and inline
     style, because it has to work when nothing else has. */
  setTimeout(function(){
    if (window.KARTI) return;                    /* it booted; nothing to do */
    if (document.getElementById('bootfail')) return;
    var d = document.createElement('div');
    d.id = 'bootfail';
    d.setAttribute('style',
      'position:fixed;inset:0;z-index:99999;display:grid;place-items:center;' +
      'background:#0E0B14;color:#EDE6FF;font:15px/1.5 system-ui,sans-serif;' +
      'padding:28px;text-align:center');
    d.innerHTML =
      '<div style="max-width:300px">' +
        '<p style="font-weight:800;font-size:18px;margin:0 0 8px">KARTI did not start</p>' +
        '<p style="opacity:.75;margin:0 0 18px">Something went wrong while updating. ' +
        'This clears the stored copy and fetches a fresh one. Your game is saved ' +
        'separately and is not touched.</p>' +
        '<button id="bootfix" style="width:100%;padding:14px;border-radius:12px;border:0;' +
        'background:#FFC542;color:#241800;font-weight:800;font-size:15px">Fix it</button>' +
      '</div>';
    document.body.appendChild(d);
    document.getElementById('bootfix').onclick = function(){
      this.textContent = 'Fixing…'; this.disabled = true;
      var done = function(){ location.replace(location.pathname + '?fresh=' + Date.now()); };
      var jobs = [];
      try { if (window.caches && caches.keys)
        jobs.push(caches.keys().then(function(k){ return Promise.all(k.map(function(n){ return caches.delete(n); })); })); } catch (e){}
      try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
        jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
          return Promise.all(rs.map(function(r){ return r.unregister(); })); })); } catch (e){}
      /* never hang on a promise that will not settle — five seconds, then go */
      Promise.race([Promise.all(jobs), new Promise(function(r){ setTimeout(r, 5000); })])
        .then(done, done);
    };
  }, 8000);
  /* Is this WebView shorter than the physical screen? That is the signature of an
   icon installed under the old apple-mobile-web-app metas (his phone reports 894
   of 956). Measured, not guessed, and re-checked on orientation change. */
/* iOS ONLY, and now stated rather than assumed. The measurement it makes —
   "the window is shorter than the screen" — is TRUE of ordinary Chrome on
   Android for an entirely different reason: the address bar in a tab, and
   the gesture bar in an installed app, are both a few dozen pixels, which
   lands inside this 20–200 window. The class it sets is a workaround for one
   iOS layout bug and means nothing on Android, so an Android phone was
   quietly wearing an iOS patch. (It is only 3px of tab-bar padding, which is
   why nobody saw it — but the next thing hung on this class would not be.)
   Android's screen.height is also unreliable in landscape on some builds,
   which is a second reason not to let it decide anything here. */
(function shortWebView(){
  var isIOS = false;
  try {
    isIOS = /iP(hone|ad|od)/.test(navigator.platform || '') ||
            (/Mac/.test(navigator.platform || '') && navigator.maxTouchPoints > 1) ||
            (/iPhone|iPad|iPod/.test(navigator.userAgent || '') &&
             !/Android/.test(navigator.userAgent || ''));
  } catch (e) {}
  function check(){
    try{
      if (!isIOS){ document.documentElement.classList.remove('short-webview'); return; }
      var gap = (screen && screen.height ? screen.height : innerHeight) - innerHeight;
      document.documentElement.classList.toggle('short-webview', gap > 20 && gap < 200);
    }catch(e){}
  }
  check();
  addEventListener('resize', check);
  addEventListener('orientationchange', function(){ setTimeout(check, 250); });
  addEventListener('pageshow', check);
})();

/* Party Games entry. js/party.js is loaded separately and may not be present on
   every deploy, so this is wired here rather than in game.js: if the hub is
   there it opens, and if it is not the player is told plainly instead of
   tapping a dead button. */
addEventListener('DOMContentLoaded', function(){
  var b = document.getElementById('btn-party');
  if (!b) return;
  b.onclick = function(){
    /* party.js has its own delegated listener on this id — let it do the work,
       so a tap does not open the hub twice. This only covers its absence. */
    if (window.KARTI_PARTY && KARTI_PARTY.open) return;
    if (window.KARTI && KARTI.toast) KARTI.toast('Party games are on the way — chess and dama first.');
  };
});

/* ═══════════════════════════════════════════════════════════════════
   INSTALL IT — the strip that turns a browser tab into an app icon

   People who arrive from a link play in a tab, and a tab is the worst way
   to play this: the browser chrome eats a fifth of the screen, it does not
   go offline, and next time they have to find the link again. Chrome and
   Edge on Android will offer an install themselves, but only as a thin
   bar most people swipe away without reading — and on an iPhone there is
   no offer AT ALL, only a menu item nobody finds by accident.

   So: one strip, platform-honest.

     ANDROID / desktop Chromium — beforeinstallprompt is captured and the
     strip's button fires the real install dialog. One tap.

     iOS SAFARI — no API exists. The strip tells them the exact two taps
     (Share, then Add to Home Screen), because "install the app" with no
     directions is where people give up.

     iOS in CHROME, FIREFOX, EDGE — Add to Home Screen is a SAFARI-ONLY
     power on iOS, whatever browser they are in. Apple does not expose it
     to anyone else. So the strip says to open the page in Safari, which
     is the only true answer and the one that otherwise costs somebody ten
     minutes of hunting a menu that cannot contain the item.

   It never shows in an already-installed window (display-mode:standalone
   or navigator.standalone), and a dismissal is remembered for a fortnight
   so it nags nobody. */
(function(){
  var KEY = 'karti_install_hint';
  var HUSH_DAYS = 14;
  var deferred = null;

  function installed(){
    try {
      if (window.matchMedia && matchMedia('(display-mode: standalone)').matches) return true;
      if (window.matchMedia && matchMedia('(display-mode: fullscreen)').matches) return true;
      if (navigator.standalone) return true;                 /* iOS home-screen app */
    } catch (e){}
    return false;
  }
  function hushed(){
    try {
      var t = parseInt(localStorage.getItem(KEY) || '0', 10);
      return t && (Date.now() - t) < HUSH_DAYS * 864e5;
    } catch (e){ return false; }
  }
  function hush(){ try { localStorage.setItem(KEY, String(Date.now())); } catch (e){} }

  var ua = navigator.userAgent || '';
  /* iPadOS 13+ reports itself as a Mac, and the only reliable tell left is a
     touch-capable "Mac" — without this an iPad is offered a dialog iOS has
     never implemented and the strip lies to it. */
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && typeof navigator.maxTouchPoints === 'number' &&
             navigator.maxTouchPoints > 1);
  /* every iOS browser is Safari underneath, so the ENGINE cannot tell them
     apart — the brand tokens in the UA string are the only way to know that
     Add to Home Screen will be missing from this particular menu */
  var iOSOther = iOS && /CriOS|FxiOS|EdgiOS|OPiOS|Brave/.test(ua);

  function strip(kind){
    if (document.getElementById('kl-inst')) return;
    var el = document.createElement('div');
    el.id = 'kl-inst';
    el.setAttribute('role', 'region');
    el.setAttribute('aria-label', 'Install KARTI');
    var body, action;
    if (kind === 'prompt'){
      body = '<b>Put KARTI on your phone</b>' +
             '<i>Full screen, works offline, one tap to open.</i>';
      action = '<button class="kl-i-go" type="button">Install</button>';
    } else if (kind === 'ios'){
      body = '<b>Add KARTI to your Home Screen</b>' +
             '<i>Tap <span class="kl-i-sh" aria-hidden="true">&#x2191;</span> Share, ' +
             'then <b>Add to Home Screen</b>.</i>';
      action = '';
    } else {
      body = '<b>Open this in Safari to install</b>' +
             '<i>On iPhone only Safari can add it to the Home Screen.</i>';
      action = '';
    }
    el.innerHTML =
      '<span class="kl-i-ic" aria-hidden="true"></span>' +
      '<span class="kl-i-tx">' + body + '</span>' +
      action +
      '<button class="kl-i-x" type="button" aria-label="Not now">&#xd7;</button>';
    document.body.appendChild(el);
    document.body.classList.add('kl-inst-on');
    requestAnimationFrame(function(){ el.classList.add('on'); });

    var go = el.querySelector('.kl-i-go');
    if (go) go.onclick = function(){
      if (!deferred) return;
      var d = deferred; deferred = null;
      try { d.prompt(); } catch (e){}
      /* whichever way they answer, stop asking on this device */
      try { d.userChoice.then(function(){ hush(); close(); }); } catch (e){ hush(); close(); }
    };
    el.querySelector('.kl-i-x').onclick = function(){ hush(); close(); };
    function close(){ el.classList.remove('on');
      document.body.classList.remove('kl-inst-on');
      setTimeout(function(){ try { el.remove(); } catch (e){} }, 260); }
  }

  /* Chromium hands us the event instead of prompting; hold it and offer our
     own button, which is far more visible than the bar it suppresses. */
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    if (!installed() && !hushed()) setTimeout(function(){ strip('prompt'); }, 2500);
  });
  window.addEventListener('appinstalled', function(){
    hush();
    document.body.classList.remove('kl-inst-on');
    var el = document.getElementById('kl-inst');
    if (el) el.remove();
  });

  /* iOS never fires the event, so its strip is decided here. Delayed so it
     lands after the splash rather than fighting it. */
  if (iOS && !installed() && !hushed())
    setTimeout(function(){ strip(iOSOther ? 'safari' : 'ios'); }, 3000);
})();

if ('serviceWorker' in navigator){
    var sw = navigator.serviceWorker;
    var born = Date.now();
    window.addEventListener('load', function(){
      /* updateViaCache:'none' — belt and braces. The spec default ('imports')
         already makes update checks bypass the HTTP cache for the top-level
         worker script, but Pages serves sw.js with max-age=600 and older WebKit
         was sloppy about this; 'none' removes any version of iOS from the
         argument. */
      sw.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
        /* iOS decides for itself when to look for a new worker, and in an
           installed app that can lag for days. Asking on every return to the
           app (and on load, which register() implies) means a deploy lands on
           the next launch — combined with the reload below, usually THE SAME
           launch. */
        document.addEventListener('visibilitychange', function(){
          if (!document.hidden) reg.update().catch(function(){});
        });
        window.addEventListener('pageshow', function(){
          reg.update().catch(function(){});
        });
      }).catch(function(){});
    });
    /* A NEW worker just took control — but this page was served by the OLD one,
       so its shell may be a version behind. Reload once and the network-first
       fetch hands over the fresh build. Guards, in order: not on the very first
       claim after install (nothing stale to replace); only within ten seconds
       of launch, so an update arriving mid-duel lights up the build tag instead
       of yanking a live game away; and never twice in 30s, so a broken worker
       cannot reload-loop the app. */
    (function(){
      var had = !!sw.controller;
      sw.addEventListener('controllerchange', function(){
        if (!had){ had = true; return; }
        if (Date.now() - born > 10000) return;
        var K = 'karti-ccreload', last = 0;
        try { last = +sessionStorage.getItem(K) || 0; } catch (e) {}
        if (Date.now() - last < 30000) return;
        try { sessionStorage.setItem(K, String(Date.now())); } catch (e) {}
        location.reload();
      });
    })();
  }
})();

/* ══ UPDATE STRIP (+ opt-in diagnostic) ══════════════════════════════════════
   TWO jobs lived in this block, and only one of them was ever for players.

   FOR PLAYERS, always on: ask the server (sw.js with cache:no-store, which can
   never be answered by a cache) whether a newer build is deployed than the one
   running. If so, become a tap-to-update strip that refreshes the worker,
   refetches the shell past every cache, and reloads. On a Pages-hosted PWA
   that is the only way a phone holding a stale worker is ever told. Keep it.

   THE DIAGNOSTIC — "v22 · sw 22 · art ok" plus a live geometry line — was a
   real instrument while chasing an iOS layout bug, and it shipped to every
   player for far too long. It is now OPT-IN and nothing but the update check
   runs without it:
       ?diag=1   turn on (remembered, so it survives the reload)
       ?diag=0   turn off
   Off is not merely "render nothing": the geometry probe, its listeners on
   resize / pointerup / visualViewport, the artwork probe and the worker-version
   query are all skipped outright, so an ordinary phone does no work for a
   readout nobody is looking at. */
(function buildTag(){
  var el = document.getElementById('buildtag');
  if (!el) return;
  var state = { swN: 0, sw: 'sw …', art: 'art …', avail: 0, geo: '' };

  /* Remembered, because the honest way to read the geometry is to turn it on
     and then reproduce the bug — which usually means a reload or an install,
     and a query string does not survive either. Wrapped: a phone with storage
     denied (iOS private mode) must still get the update strip. */
  var DIAG = false;
  try {
    var q = String(location.search || '');
    if (/[?&]diag=1/.test(q))      { DIAG = true;  localStorage.setItem('karti_diag', '1'); }
    else if (/[?&]diag=0/.test(q)) { DIAG = false; localStorage.removeItem('karti_diag'); }
    else DIAG = localStorage.getItem('karti_diag') === '1';
  } catch (e) { DIAG = /[?&]diag=1/.test(String(location.search || '')); }

  /* ── live geometry ────────────────────────────────────────────────────────
     An installed iOS app was showing a band of dead space BELOW the fixed tab
     bar. Nothing reproduces on desktop, so the phone has to report its own
     numbers. Everything here is a read — no element is moved, sized or styled
     as a result, so this cannot itself cause the bug it is measuring.

       sa|br|fs|mu   which display-mode media query actually matches (the
                     shell no longer branches on it — this is context only).
       ih / vv / sc  innerHeight, visualViewport.height, screen.height. The
                     gaps BETWEEN these three are the diagnosis.
       app h/b       #app's own height and where its bottom edge really lands.
       bar           the tab bar's bottom edge. Should equal ih.
       sab / sat     the safe-area insets as resolved on the device.

     --sab/--sat are read off a probe rather than getPropertyValue(), because a
     custom property holding env() can come back as the literal token; padding
     on a real (off-screen, zero-size, fixed) element always computes to px. */
  var probe = null;
  function insets(){
    if (!probe){
      probe = document.createElement('div');
      probe.setAttribute('aria-hidden', 'true');
      probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:0;height:0;' +
        'visibility:hidden;pointer-events:none;' +
        'padding-top:var(--sat);padding-bottom:var(--sab)';
      document.body.appendChild(probe);
    }
    var cs = getComputedStyle(probe);
    return { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 };
  }
  function dmode(){
    var modes = ['standalone', 'fullscreen', 'minimal-ui', 'browser'];
    var tag = { standalone:'sa', fullscreen:'fs', 'minimal-ui':'mu', browser:'br' };
    var hit = [];
    for (var i = 0; i < modes.length; i++){
      try { if (matchMedia('(display-mode: ' + modes[i] + ')').matches) hit.push(tag[modes[i]]); }
      catch (e) {}
    }
    return hit.length ? hit.join('+') : '?';
  }
  var r0 = function(n){ return (n == null || isNaN(n)) ? '-' : Math.round(n); };
  function measure(){
    var vv = window.visualViewport;
    var app = document.getElementById('app');
    var bar = document.getElementById('home-nav');
    var ar = app ? app.getBoundingClientRect() : null;
    var br = bar ? bar.getBoundingClientRect() : null;
    var ins = insets();
    state.geo =
      dmode() +
      ' | ih' + r0(window.innerHeight) +
      ' vv' + r0(vv ? vv.height : null) +
      ' sc' + r0(screen && screen.height) +
      ' | app' + r0(ar ? ar.height : null) + '/' + r0(ar ? ar.bottom : null) +
      ' bar' + r0(br ? br.bottom : null) +
      ' | sab' + r0(ins.b) + ' sat' + r0(ins.t);
    paint();
  }
  var geoRaf = 0;
  function queueGeo(){
    if (geoRaf) return;
    geoRaf = requestAnimationFrame(function(){ geoRaf = 0; measure(); });
  }

  function paint(){
    /* Keyed off the PAGE build, not the worker: the layout lives in this file,
       so a phone whose worker updated but whose page did not is still stale in
       the way that matters, and must still be offered the update. */
    if (state.avail > KARTI_BUILD){
      el.className = 'upd';
      el.textContent = 'Update ready — tap to load v' + state.avail +
        ' (this is v' + KARTI_BUILD + ')';
      return;
    }
    el.className = '';
    el.textContent = '';
    /* Nothing is waiting and nobody asked for numbers: show the player an empty
       strip. This is the ordinary case on every phone. */
    if (!DIAG) return;
    el.appendChild(document.createTextNode(
      'v' + KARTI_BUILD + ' · ' + state.sw + ' · ' + state.art));
    /* aria-hidden: this line changes on every toolbar nudge and every rotate,
       and #buildtag is an aria-live region — without it a screen reader would
       read a wall of numbers aloud each time. */
    var g = document.createElement('span');
    g.className = 'geo';
    g.setAttribute('aria-hidden', 'true');
    g.textContent = state.geo || 'measuring…';
    el.appendChild(g);
  }
  if (DIAG) (function artProbe(){
    var im = new Image();
    im.onload = function(){ state.art = 'art ok'; paint(); };
    im.onerror = function(){ state.art = 'no art'; paint(); };
    im.src = 'art/ui/home-bg.jpg';
  })();
  function askSW(){
    if (!('serviceWorker' in navigator)){ state.sw = 'no sw'; return paint(); }
    window.swVersion().then(function(v){
      if (v){
        state.swN = +((String(v).match(/\d+/) || [0])[0]);
        state.sw = 'sw ' + (state.swN || v);
      } else { state.swN = 0; state.sw = 'no sw'; }
      paint();
    });
  }
  function askServer(){
    fetch('sw.js', { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.text() : ''; })
      .then(function(t){
        var m = t.match(/karti-v(\d+)/);
        if (m){ state.avail = +m[1]; paint(); }
      })
      .catch(function(){ /* offline — nothing to report */ });
  }
  el.addEventListener('click', function(){
    if (!el.classList.contains('upd')) return;
    el.textContent = 'Updating…';
    var reload = function(){ location.reload(); };
    var upd = ('serviceWorker' in navigator)
      ? navigator.serviceWorker.getRegistrations()
          .then(function(rs){ return Promise.all(rs.map(function(r){ return r.update(); })); })
          .catch(function(){})
      : Promise.resolve();
    upd.then(function(){
      /* pull the shell past the HTTP cache AND through the (new) worker, so the
         reload has a fresh copy waiting whichever path ends up serving it */
      return Promise.all([
        fetch('index.html', { cache: 'reload' }).catch(function(){}),
        fetch('./', { cache: 'reload' }).catch(function(){})
      ]);
    }).then(reload, reload);
  });
  /* The update check is the part every phone runs. */
  paint(); askServer();
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden){ askServer(); if (DIAG){ queueGeo(); askSW(); } }
  });

  /* ── everything below here is the opt-in instrument ────────────────────── */
  if (!DIAG) return;
  measure(); askSW();
  /* never show a stale reading: re-measure on everything that can move the
     bottom edge — a rotate, a keyboard, and (iOS) a toolbar sliding away
     mid-scroll, which changes the visible height without firing resize. */
  addEventListener('resize', queueGeo);
  addEventListener('orientationchange', function(){ setTimeout(measure, 300); });
  addEventListener('pageshow', queueGeo);
  /* The tab bar only exists on Home, and Home is display:none while you are on
     any other screen — measured then, its rect reads all zeroes. Re-measure
     after every tap (the router runs on taps) and a few times after boot, so
     whenever the screenshot is actually taken the numbers are the live ones. */
  addEventListener('pointerup', queueGeo, { passive:true });
  [400, 1200, 3000].forEach(function(ms){ setTimeout(queueGeo, ms); });
  /* and precisely when Home is switched on or off, which is the moment the bar
     gains or loses a box. One observer, one attribute, no polling. */
  (function(){
    var home = document.getElementById('scr-home');
    if (!home || !window.MutationObserver) return;
    new MutationObserver(queueGeo).observe(home, { attributes:true, attributeFilter:['class'] });
  })();
  if (window.visualViewport){
    visualViewport.addEventListener('resize', queueGeo);
    visualViewport.addEventListener('scroll', queueGeo);
  }
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.addEventListener('controllerchange',
      function(){ setTimeout(askSW, 400); });
})();
/* ══ END BUILD TAG ══ */
</script>
</body>
</html>
