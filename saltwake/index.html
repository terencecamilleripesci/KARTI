<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#12161f">
<title>Saltwake — The Quiet Beacon</title>
<!--
  SALTWAKE — PHASE 0 SHELL. Deliberately DOM and CSS, not canvas: the whole question
  is whether the loop is fun with big thumb-sized buttons, and DOM gives
  that for free with real hit targets, real text scaling and real
  accessibility. A canvas would mean reimplementing all three before
  learning anything. Phase 1's tile overworld is where a canvas earns its
  place.

  Mobile first and mobile only for now — 390x844 is the reference, and
  every control is at least 44px tall.
-->
<style>
  :root {
    --bg:#12161f; --panel:#1b2130; --line:#2b3446; --ink:#e8ecf5;
    --dim:#96a0b5; --hot:#f0803c; --good:#4fd18b; --bad:#e2564a;
    --ember:#f0803c; --tide:#49a8e0; --bloom:#63c65b;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; justify-content:center; }
  #app { width:100%; max-width:480px; min-height:100%; display:flex;
    flex-direction:column; padding:env(safe-area-inset-top) 12px
    calc(env(safe-area-inset-bottom) + 12px); }

  h1 { font-size:19px; margin:14px 2px 2px; letter-spacing:.3px; }
  .sub { color:var(--dim); font-size:13px; margin:0 2px 12px; }

  .card { background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:12px; margin-bottom:10px; }

  button { font:inherit; color:var(--ink); background:#243049;
    border:1px solid var(--line); border-radius:12px; padding:13px 14px;
    min-height:48px; width:100%; text-align:left; display:block;
    margin-bottom:8px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button[disabled] { opacity:.4; }
  button.hot { background:#3a2a1e; border-color:#5b3d28; }
  button.wide { text-align:center; font-weight:600; }
  .row { display:flex; gap:8px; }
  .row > button { margin-bottom:0; }

  /* a creature: the sprite if it exists, else a shape from data.js.
     The fallback is not a placeholder to be replaced later — it is what
     lets the loop be played and judged BEFORE any art is bought. */
  /* sprite over shape, SAME grid cell: the shape is the fallback and the
     image simply covers it when it loads. No onerror handler needed. */
  .mon { width:96px; height:96px; display:grid; place-items:center;
    image-rendering:pixelated; }
  .mon > * { grid-area:1/1; }
  .mon img { width:96px; height:96px; image-rendering:pixelated; display:block; }
  /* hidden until a sprite fails to load — game.js paintMons() */
  .blob { width:64px; height:64px; border:3px solid rgba(0,0,0,.55);
    display:none; }
  .blob.round { border-radius:50%; }
  .blob.leaf  { border-radius:50% 8% 50% 8%; }
  .blob.spike { clip-path:polygon(50% 0,100% 72%,72% 100%,28% 100%,0 72%); }
  .blob.block { border-radius:4px; }

  .fight { display:flex; flex-direction:column; gap:6px; }
  .side { display:flex; align-items:center; gap:10px; }
  .side.me { flex-direction:row-reverse; }
  .meta { flex:1 1 auto; min-width:0; }
  .nm { font-weight:600; font-size:15px; display:flex; gap:6px;
    align-items:center; }
  .lv { color:var(--dim); font-weight:400; font-size:13px; }
  .bar { height:9px; background:#0d1118; border-radius:6px; overflow:hidden;
    margin-top:5px; border:1px solid var(--line); }
  .bar > i { display:block; height:100%; background:var(--good);
    transition:width .35s ease; }
  .bar.low > i { background:var(--hot); }
  .bar.crit > i { background:var(--bad); }
  .hpnum { font-size:12px; color:var(--dim); margin-top:3px; }

  .pill { font-size:11px; padding:2px 7px; border-radius:99px;
    text-transform:uppercase; letter-spacing:.5px; font-weight:700;
    color:#10141c; }
  .pill.ember { background:var(--ember); }
  .pill.tide  { background:var(--tide); }
  .pill.bloom { background:var(--bloom); }

  #log { height:104px; overflow-y:auto; font-size:13.5px; color:var(--dim);
    background:#0e131c; border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; }
  #log p { margin:0 0 4px; }
  #log p.big { color:var(--ink); font-weight:600; }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid2 > button { margin-bottom:0; }
  .mv { display:flex; justify-content:space-between; align-items:center;
    gap:6px; }
  .mv small { color:var(--dim); font-weight:400; }
  .eff { font-size:11px; font-weight:700; }
  .eff.up { color:var(--good); } .eff.dn { color:var(--bad); }

  .party { display:flex; gap:8px; overflow-x:auto; padding:2px; }
  .slot { flex:0 0 auto; width:92px; background:#161c28;
    border:1px solid var(--line); border-radius:12px; padding:8px;
    text-align:center; font-size:12px; }
  .slot.out { border-color:var(--hot); }
  .slot .mon, .slot img { width:56px; height:56px; }
  .slot .blob { width:40px; height:40px; }
  .faint { opacity:.35; }
  .note { color:var(--dim); font-size:12px; margin:8px 2px 0; }

  /* ── the overworld ──────────────────────────────────────────────
     The canvas is sized in CSS pixels and backed at devicePixelRatio,
     and overworld.js only ever scales tiles by a WHOLE number, so the
     pixel art stays crisp instead of showing uneven seams. */
  #stage { position:relative; border-radius:14px; overflow:hidden;
    border:1px solid var(--line); background:#0d1118; }
  #cv { display:block; width:100%; height:auto; image-rendering:pixelated; }
  .hudrow { display:flex; gap:8px; align-items:center; margin:8px 0 0; }
  .hudrow .where { flex:1 1 auto; font-size:13px; color:var(--dim); }
  .hudrow button { width:auto; margin:0; padding:9px 14px; min-height:40px; }

  /* A D-PAD OF ARROW BUTTONS, not a joystick. The same choice was made
     for the RPG Maker player on this machine after a joystick was
     rejected: discrete buttons match grid-locked movement, where every
     input is one of four directions and an analog angle has to be
     quantised anyway. */
  .dpad { display:grid; grid-template-columns:repeat(3,64px);
    grid-template-rows:repeat(3,56px); gap:6px; justify-content:center;
    margin:12px auto 0; }
  .dpad button { width:100%; height:100%; margin:0; padding:0;
    font-size:22px; text-align:center; display:grid; place-items:center;
    background:#26324b; }
  .dpad button:active { background:#38486b; }
  .d-up { grid-area:1/2; } .d-left { grid-area:2/1; }
  .d-right { grid-area:2/3; } .d-down { grid-area:3/2; }
  .d-mid { grid-area:2/2; background:transparent !important;
    border-color:transparent !important; }
</style>
</head>
<body>
<div id="app">
  <h1>Saltwake <span style="color:var(--dim);font-weight:400">The Quiet Beacon</span></h1>
  <p class="sub" id="ask">Does catching something make you want to change your team?</p>
  <div id="screen"></div>
</div>

<script src="data.js"></script>
<script src="overworld.js"></script>
<script src="battle.js"></script>
<script src="game.js"></script>
</body>
</html>
