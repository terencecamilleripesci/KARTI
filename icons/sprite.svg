<svg xmlns="http://www.w3.org/2000/svg" id="karti-sprite" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
<!-- ═══════════════════════════════════════════════════════════════════
     KARTI icon set — drawn by hand on a 24x24 grid, 2px round strokes,
     one weight across the whole set, legible down to 14px on a dark
     background. Single colour: everything is currentColor, so the
     faction colours / gold / rarity colours drive them from CSS.
     No emoji, no icon font, no network — <use href="#i-NAME"> only.
     Stroke + fill live on each <symbol> as PRESENTATION ATTRIBUTES on
     purpose: a CSS rule on .ico would otherwise beat any per-path
     override and flatten every solid shape.
     This file is the source of truth; the identical markup is inlined
     once into index.html, between the SPRITE marker comments.
     ═══════════════════════════════════════════════════════════════════ -->
<defs>

<!-- ───────── ATTRIBUTES / FACTIONS ───────── -->

<!-- FESTA — the village petard going off at 3am. Loud, fast, everywhere. -->
<symbol id="i-attr-festa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
  <path d="M12 1.8v3.4M12 18.8v3.4M1.8 12h3.4M18.8 12h3.4"/>
  <path d="M4.8 4.8l2.4 2.4M16.8 16.8l2.4 2.4M19.2 4.8l-2.4 2.4M7.2 16.8l-2.4 2.4"/>
</symbol>

<!-- FARM (razzett) — an ear of wheat. Slow, heavy, feeds the whole village. -->
